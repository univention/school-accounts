server {
 listen 80;
 server_name user-management-ui;
 root /app;
 location / {
   alias /app/;
   try_files $uri /index.html;
 }

 location /favicon.ico {
   alias /app/favicon.ico;
   try_files $uri =404;
 }
 location /config.json {
   alias /app/config.json;
   try_files $uri =404;
 }

 location /assets/ {
   alias /app/assets/;
   try_files $uri =404;
 }
}
