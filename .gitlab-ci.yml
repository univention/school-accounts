include:
  - project: univention/dist/docker-services
    file:
      - kaniko.yml
  - project: 'univention/documentation/sphinx-docker'
    file: 'pipeline/sphinx.yml'

variables:
  APPCENTER_CONTROL_IMAGE: "docker-registry.knut.univention.de/knut/univention-appcenter-control"
  IMAGE_UCS_EC2_TOOLS: "docker-registry.knut.univention.de/ucs-ec2-tools"
  POETRY_VERSION: "1.7.1"
  DOC_TARGET_VERSION: "0.1.1"
  DOC_TARGET_NAME: "ucsschool-user-management-module"
  DOC_TARGET_PATH: "$DOC_TARGET_NAME/$DOC_TARGET_VERSION"
  DOCS_DIR: "docs/$DOC_TARGET_NAME"
  DEV_IMAGE_NAME: ci-image
  DEV_IMAGE_TAG: $CI_REGISTRY_IMAGE/$DEV_IMAGE_NAME:$CI_COMMIT_REF_SLUG
  PRE_COMMIT_HOME: .cache/pre-commit-home
  POETRY_CACHE_DIR: .cache/pypoetry
  YARN_CACHE_FOLDER: .cache/yarn
  npm_config_cache: .cache/npm
  PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright


workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_OPEN_MERGE_REQUESTS
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "webide"

stages:
  - prepare
  - test
  - lint
  - publish
  - build
  - merge
  - production
  - integration_test

build_dev_image:
  stage: prepare
  needs: []
  extends: .kaniko
  variables:
    KANIKO_BUILD_CONTEXT: "$CI_PROJECT_DIR/dev"
    IMAGE_TAG: $DEV_IMAGE_TAG
    KANIKO_ARGS: --build-arg commit="$CI_COMMIT_SHA" --build-arg date="$CI_JOB_STARTED_AT" --skip-unused-stages --cache=true --cache-repo=$CI_REGISTRY_IMAGE/$DEV_IMAGE_NAME/cache


run_pre-commit:
  stage: lint
  needs: [build_dev_image]
  image: $DEV_IMAGE_TAG
  cache: &cache
    key: $CI_COMMIT_REF_SLUG
    paths:
      - .cache/
  before_script:
    PROJECT_DIR="." ./dev/scripts/install_deps.sh
  script:
    - pre-commit run -a


bff-test:
  stage: test
  needs: [build_dev_image]
  image: $DEV_IMAGE_TAG
  before_script:
    - ./user-management-bff/scripts/test_setup.sh
  script:
    - poetry run --directory user-management-bff/ pytest -vv -m "not e2e" --junitxml=report.xml user-management-bff/
  rules:
    - if: "$CI_COMMIT_MESSAGE =~ /skip-build/ || $pipeline =~ /skip-build/"
      when: never
    - if: "$CI_COMMIT_MESSAGE =~ /force-build/ || $pipeline =~ /force-build/"
    - changes:
        - user-management-bff/**/*
        - user-management-ui/**/*
  artifacts:
    reports:
      junit: report.xml

integration-tests:
  stage: integration_test
  needs:
    - job: build_docker_image_user_management
      optional: true
      artifacts: true
  rules:
    - changes:
        - user-management-bff/**/*
        - user-management-ui/**/*
        - appcenter-management/**/*
        - dev/tests/**/*
      when: manual
      allow_failure: false
    - when: manual
      allow_failure: true
  image: $IMAGE_UCS_EC2_TOOLS
  variables:
    TARGET_VERSION: "5.0-7"
    KVM_SERVER: "soft-test03.knut.univention.de"
    UCS_UTILS_URL: "https://git.knut.univention.de/univention/ucs/-/raw/5.2-0/test/utils/"
  before_script:
    - apt-get update && apt-get install -y curl || echo "Curl installed."
    - cd dev/tests/
    - mkdir utils
    - curl -o utils/utils.sh "$UCS_UTILS_URL/utils.sh"
    - curl -o utils/utils-local.sh "$UCS_UTILS_URL/utils-local.sh"
    - chmod +x utils/utils-local.sh
    - mkdir ~/.ssh/
    - mkdir -p ~/ec2/keys
    - cp "$SSH_PRIVATE_KEY_BUILD" ~/.ssh/id_rsa
    - cp "$SSH_PRIVATE_KEY_TECH" ~/ec2/keys/tech.pem
    - chmod 0600 ~/.ssh/id_rsa
    - chmod 0600 ~/ec2/keys/tech.pem
  script:
    - env --chdir ../../appcenter-management/ ./scripts/generate-preinst
    - if [ -z ${NO_HALT+x} ]; then ucs-kvm-create -t -c integration_tests.cfg; else ucs-kvm-create -c integration_tests.cfg; fi
    - test -e COMMAND_SUCCESS
  artifacts:
    when: always
    paths:
      - dev/tests/primary_join.log
      - dev/tests/backup1_join.log
    reports:
      junit: dev/tests/*junit.xml


bff-coverage:
  extends: bff-test
  variables:
    BFF_COVERAGE_LIMIT: "100"
  before_script:
    - ./user-management-bff/scripts/test_setup.sh
    - pip install poetry=="$POETRY_VERSION"
    - poetry config --directory user-management-bff/ --local virtualenvs.create false
    - poetry install --directory user-management-bff/
  script:
    - poetry run --directory user-management-bff/ pytest -vv -m "not e2e" --cov --cov-config=user-management-bff/pyproject.toml --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under="$BFF_COVERAGE_LIMIT" user-management-bff/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build_docker_image_user_management:
  stage: prepare
  rules:
    - changes:
        - user-management-bff/**/*
        - user-management-ui/**/*
  extends: .kaniko
  variables:
    KANIKO_BUILD_CONTEXT: "$CI_PROJECT_DIR/"
    CI_REGISTRY_IMAGE: $CI_REGISTRY_IMAGE/ucsschool-user-management
    KANIKO_ARGS: --build-arg commit="$CI_COMMIT_SHA" --build-arg date="$CI_JOB_STARTED_AT" --skip-unused-stages --cache=true --cache-repo=$CI_REGISTRY_IMAGE/cache

docs-linkcheck:
  extends: .sphinx-linkcheck-template
  rules:
    - changes:
      - docs/ucsschool-user-management-module/**/*

docs-spelling:
  extends: .sphinx-spelling-template
  rules:
    - changes:
      - docs/ucsschool-user-management-module/**/*

docs-html:
  extends: .sphinx-html-template
  rules:
    - changes:
      - docs/ucsschool-user-management-module/**/*

docs-pdf:
  extends: .sphinx-pdf-template
  rules:
    - changes:
      - docs/ucsschool-user-management-module/**/*

docs-merge-to-one-artifact:
  extends: .sphinx-merge-template
  needs:
    - job: docs-html
    - job: docs-pdf
    - job: docs-spelling
      artifacts: false
    - job: docs-linkcheck
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
      - docs/ucsschool-user-management-module/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
      - docs/ucsschool-user-management-module/**/*
      when: manual

# The template has inherit:variables:false to prevent the passing of pipeline
# variables to downstream, and therefore $DOCS_DIR is not available here.
docs-create-production-merge-request:
  extends: .sphinx-docs-merge-request-template
  needs:
    - job: docs-merge-to-one-artifact
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
      - docs/**/*

user_management_app_to_test_appcenter:
  stage: publish
  variables:
    APP_ID: "ucsschool-user-management"
    APP_DIR: "appcenter-management"
    APP_NAME: "5.0/$APP_ID"
  image: $APPCENTER_CONTROL_IMAGE
  needs: []
  script:
    - cd "$APP_DIR"
    - APP_VERSION="$(sed -n 's/^Version\s*=\s*//p' ini)"
    - echo "updating $APP_NAME=$APP_VERSION"
    - ./scripts/generate-preinst
    - univention-appcenter-control upload "$APP_NAME=$APP_VERSION" compose configure_host inst ini preinst README_UPDATE_DE README_UPDATE_EN settings uinst
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - $APP_DIR/**/*
