# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
    - id: check-added-large-files
      exclude: '^ucsschool-accounts-bff/basedpyright-baseline\.json$'
    - id: check-json
    - id: check-xml
    - id: check-yaml
      # the GitLab CI config uses the custom "!reference" tag
      args: [--unsafe]
    - id: check-toml
    - id: trailing-whitespace
      exclude: '^ucsschool-accounts-bff/ucsschool_accounts_bff/static/vendor/'
    - id: pretty-format-json
      args: [--autofix]
      exclude: '^ucsschool-accounts-bff/basedpyright-baseline\.json$|^ucsschool-accounts-bff/ucsschool_accounts_bff/static/vendor/'
- repo: local
  hooks:
    - id: bff-translation-check
      name: bff-translation-check
      entry: ucsschool-accounts-bff/scripts/check_translations.sh
      language: script
      pass_filenames: false
- repo: local
  hooks:
    # Native hooks run by default: this repo's local dev workflow (dev/dev_run.sh pre-commit run -a)
    # already wraps pre-commit itself inside the dev container, which has uv/git but no docker.sock,
    # so a docker_image-based default hook would fail there. The container hooks below are kept as
    # manual-stage fallbacks for contributors running bare pre-commit without a local uv/Python setup.
    - id: basedpyright-bff-native-baseline
      name: basedpyright (bff, relative to baseline, native)
      language: system
      entry: |
        sh -c 'cd ucsschool-accounts-bff && uv sync --python 3.11 && \
          uv pip install basedpyright==1.39.8 && \
          .venv/bin/basedpyright \
            --project pyrightconfig.json \
            --baselinefile basedpyright-baseline.json \
            --baselinemode=auto' --
      pass_filenames: false
      types: [python]
      files: ^ucsschool-accounts-bff/
    - id: basedpyright-bff-container-baseline
      name: basedpyright (bff, relative to baseline, docker)
      language: system
      entry: docker/pre_commit/run-basedpyright.sh ucsschool-accounts-bff baseline
      stages: [manual]
      pass_filenames: false
      types: [python]
      files: ^ucsschool-accounts-bff/
    - id: basedpyright-bff-container-no-baseline
      name: basedpyright (bff, lint file, no baseline)
      language: system
      entry: docker/pre_commit/run-basedpyright.sh ucsschool-accounts-bff no-baseline
      stages: [manual]
      pass_filenames: true
      types: [python]
      files: ^ucsschool-accounts-bff/
    - id: basedpyright-bff-container-write-baseline
      name: basedpyright (bff, write baseline)
      language: system
      entry: docker/pre_commit/run-basedpyright.sh ucsschool-accounts-bff write-baseline
      stages: [manual]
      pass_filenames: false
      files: ^ucsschool-accounts-bff/
- repo: https://github.com/jackdewinter/pymarkdown
  rev: v0.9.15
  hooks:
    - id: pymarkdown
      args:
        - --disable-rules
        - MD013,MD024,MD034,MD041
        - scan
        # Rules pymarkdown: https://github.com/jackdewinter/pymarkdown/blob/main/docs/rules.md
        # Rules markdownlint: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md
        # MD013: Allow arbitrary line length
        # MD024: Allow duplicate headings
        # MD034: Allow bare URLs
        # MD041: First line in file should be a top level heading
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 'v0.3.4'
  hooks:
    - id: ruff
      args: [--fix]
    - id: ruff-format
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.11.21 # Check for the latest release on GitHub
  hooks:
    # Ensure uv lock is up-to-date
    - id: uv-lock
      files: ucsschool-accounts-bff/pyproject.toml
      args: [ --project, ucsschool-accounts-bff ]
- repo: https://git.knut.univention.de/univention/infrastructure/pre-commit-hooks/pre-commit-copyright
  rev: 0.2.1
  hooks:
    - id: reuse-toml-dry-run
    - id: reuse-toml
      stages: [ manual ]
    - id: update-copyright-year
      stages: [ manual ]
- repo: https://github.com/fsfe/reuse-tool
  rev: v6.2.0
  hooks:
    - id: reuse
      alias: reuse-annotate
      name: "reuse annotate"
      args: ["annotate", "-c", "Univention GmbH", "-l", "AGPL-3.0-only", "--skip-unrecognised", "--skip-existing", "--template", "univention"]
      pass_filenames: true
      description: "Annotate all unlicensed files as AGPL-3.0-only with Univention GmbH copyright"
      stages: [manual]
      # we have to specify everything already covered by REUSE.toml again due to
      # https://github.com/fsfe/reuse-tool/issues/1190
      # MAKE SURE THIS IS IN SYNC WITH REUSE.toml
      # every path below is already licensed via one of:
      #  - the manual [[annotations]] block at the top of REUSE.toml
      #  - a dedicated block further down (doc images, spelling wordlists, vendored code)
      # some are also uncommentable formats (json/csv/svg/png) where reuse-annotate
      # would otherwise create stray *.license sidecar files instead of skipping
      exclude: "^basedpyright-baseline[.]json$\
                |^pyrightconfig[.]json$\
                |^renovate[.]json$\
                |^appcenter-management/files/.*[.]json$\
                |^dev/data/.*[.]json$\
                |^dev/tests/.*[.]json$\
                |^dev/tests/.*[.]csv$\
                |^docs/ucsschool-accounts/spelling_wordlist$\
                |^docs/ucsschool-accounts/_static/.*[.]pdf$\
                |^ucsschool-accounts-bff/uv[.]lock$\
                |^ucsschool-accounts-bff/tests/data/.*[.]json$\
                |^ucsschool-accounts-bff/ucsschool_accounts_bff/static/vendor/alpine[.]min[.]js$\
                |^ucsschool-accounts-bff/ucsschool_accounts_bff/static/vendor/htmx[.]min[.]js$\
                |^ucsschool-accounts-bff/ucsschool_accounts_bff/static/vendor/univention-design-system[.]js$\
                |^ucsschool-accounts-bff/ucsschool_accounts_bff/static/vendor/univention-design-system[.]css$\
                "
      language_version: python3.11
    - id: reuse
      alias: reuse-lint
      stages: [manual]
      language_version: python3.11
    - id: reuse-lint-file
      language_version: python3.11
- repo: local
  hooks:
    - id: cerbos-policy-check-docker
      name: cerbos-policy-check (docker)
      description: "Lints and tests Cerbos policies via `cerbos compile`, using the cerbos docker-compose service"
      entry: dev/dev_run.sh task cerbos-compile
      language: script
      stages: [manual]
      pass_filenames: false
      files: '^appcenter-management/files/policies/'
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.3.0
  hooks:
    - id: conventional-pre-commit
      stages: [ commit-msg ]
      args: ["--strict"]
- repo: local
  hooks:
    - id: issue-reference
      stages: [ commit-msg ]
      name: issue-reference
      language: pygrep
      entry: '.*\n\n(Issue \w+(/[a-zA-Z_-]+)*#\d+|Bug #\d+)\n+(\n.*)*\Z'
      args: ["--multiline", "--negate"]
