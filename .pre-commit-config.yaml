# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
    - id: check-added-large-files
      exclude: '^(user-management-bff|dev/tests/product-tests)/basedpyright-baseline\.json$'
    - id: check-json
    - id: check-xml
    - id: check-yaml
    - id: check-toml
    - id: trailing-whitespace
      exclude: '^user-management-bff/user_management_bff/static/vendor/'
    - id: pretty-format-json
      args: [--autofix]
      exclude: '^(user-management-bff|dev/tests/product-tests)/basedpyright-baseline\.json$|^user-management-bff/user_management_bff/static/vendor/'
- repo: https://github.com/psf/black-pre-commit-mirror
  rev: 24.1.1
  hooks:
    - id: black
      args: ["--config", "user-management-bff/pyproject.toml"]
      language_version: python3.11
- repo: https://github.com/PyCQA/bandit
  rev: 1.7.6
  hooks:
    - id: bandit
      exclude: "user-management-bff/tests|appcenter-management/scripts/test_*"
- repo: local
  hooks:
    - id: bff-translation-check
      name: bff-translation-check
      entry: user-management-bff/scripts/check_translations.sh
      language: script
      pass_filenames: false
- repo: local
  hooks:
    # Native hooks run by default: this repo's local dev workflow (dev/dev_run.sh pre-commit run -a)
    # already wraps pre-commit itself inside the dev container, which has uv/git but no docker.sock,
    # so a docker_image-based default hook would fail there. The container hooks below are kept as
    # manual-stage fallbacks for contributors running bare pre-commit without a local uv/Python setup.
    - id: basedpyright-bff-native-baseline
      name: basedpyright (bff, relative to baseline, native)
      language: system
      entry: |
        sh -c 'cd user-management-bff && uv sync --python 3.11 && \
          uv pip install basedpyright==1.39.8 && \
          .venv/bin/basedpyright \
            --project pyrightconfig.json \
            --baselinefile basedpyright-baseline.json \
            --baselinemode=auto' --
      pass_filenames: false
      types: [python]
      files: ^user-management-bff/
    - id: basedpyright-bff-container-baseline
      name: basedpyright (bff, relative to baseline, docker)
      language: system
      entry: docker/pre_commit/run-basedpyright.sh user-management-bff baseline
      stages: [manual]
      pass_filenames: false
      types: [python]
      files: ^user-management-bff/
    - id: basedpyright-bff-container-no-baseline
      name: basedpyright (bff, lint file, no baseline)
      language: system
      entry: docker/pre_commit/run-basedpyright.sh user-management-bff no-baseline
      stages: [manual]
      pass_filenames: true
      types: [python]
      files: ^user-management-bff/
    - id: basedpyright-bff-container-write-baseline
      name: basedpyright (bff, write baseline)
      language: system
      entry: docker/pre_commit/run-basedpyright.sh user-management-bff write-baseline
      stages: [manual]
      pass_filenames: false
      files: ^user-management-bff/
    - id: basedpyright-product-tests-native-baseline
      name: basedpyright (product-tests, relative to baseline, native)
      language: system
      entry: |
        sh -c 'cd dev/tests/product-tests && uv sync --python 3.11 && \
          uv pip install basedpyright==1.39.8 && \
          .venv/bin/basedpyright \
            --project pyrightconfig.json \
            --baselinefile basedpyright-baseline.json \
            --baselinemode=auto' --
      pass_filenames: false
      types: [python]
      files: ^dev/tests/product-tests/
    - id: basedpyright-product-tests-container-baseline
      name: basedpyright (product-tests, relative to baseline, docker)
      language: system
      entry: docker/pre_commit/run-basedpyright.sh dev/tests/product-tests baseline
      stages: [manual]
      pass_filenames: false
      types: [python]
      files: ^dev/tests/product-tests/
    - id: basedpyright-product-tests-container-no-baseline
      name: basedpyright (product-tests, lint file, no baseline)
      language: system
      entry: docker/pre_commit/run-basedpyright.sh dev/tests/product-tests no-baseline
      stages: [manual]
      pass_filenames: true
      types: [python]
      files: ^dev/tests/product-tests/
    - id: basedpyright-product-tests-container-write-baseline
      name: basedpyright (product-tests, write baseline)
      language: system
      entry: docker/pre_commit/run-basedpyright.sh dev/tests/product-tests write-baseline
      stages: [manual]
      pass_filenames: false
      files: ^dev/tests/product-tests/
- repo: https://github.com/jackdewinter/pymarkdown
  rev: v0.9.15
  hooks:
    - id: pymarkdown
      args:
        - --disable-rules
        - MD013,MD024,MD034,MD041
        - scan
        # Rules pymarkdown: https://github.com/jackdewinter/pymarkdown/blob/main/docs/rules.md
        # Rules markdownlint: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md
        # MD013: Allow arbitrary line length
        # MD024: Allow duplicate headings
        # MD034: Allow bare URLs
        # MD041: First line in file should be a top level heading
- repo: https://github.com/charliermarsh/ruff-pre-commit
  rev: 'v0.3.4'
  hooks:
    - id: ruff
      args: [--fix]
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.11.21 # Check for the latest release on GitHub
  hooks:
    # Ensure uv lock is up-to-date
    - id: uv-lock
      files: user-management-bff/pyproject.toml
      args: [ --project, user-management-bff ]
    - id: uv-lock
      files: dev/tests/product-tests/pyproject.toml
      args: [ --project, dev/tests/product-tests ]
- repo: https://github.com/fsfe/reuse-tool
  rev: v5.0.2
  hooks:
    - id: reuse
- repo: https://github.com/anderseknert/pre-commit-opa
  rev: v1.5.1
  hooks:
    - id: opa-fmt
    - id: opa-check
      args: ["appcenter-management/files/conditions", ".cache/opa", "--ignore=\"*.json\""]
    - id: opa-test
      args: ["appcenter-management/files/conditions", ".cache/opa", "-v", "--ignore=\"*.json\""]
-   repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [ commit-msg ]
        args: ["--strict"]
-   repo: local
    hooks:
      - id: issue-reference
        stages: [ commit-msg ]
        name: issue-reference
        language: pygrep
        entry: '.*\n\n(Issue \w+(/[a-zA-Z_-]+)*#\d+|Bug #\d+)\n+(\n.*)*\Z'
        args: ["--multiline", "--negate"]
