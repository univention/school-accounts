# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
    - id: check-added-large-files
    - id: check-json
    - id: check-xml
    - id: check-yaml
      # the GitLab CI config uses the custom "!reference" tag
      args: [--unsafe]
    - id: check-toml
    - id: trailing-whitespace
      exclude: '^ucsschool-accounts/ucsschool_accounts/static/vendor/'
    - id: pretty-format-json
      args: [--autofix]
      # ty writes its baseline in its own key order, which this hook would sort.
      exclude: '^ty-baseline\.json$|^ucsschool-accounts/ucsschool_accounts/static/vendor/'
- repo: local
  hooks:
    - id: accounts-translation-check
      name: accounts-translation-check
      entry: ucsschool-accounts/scripts/check_translations.sh
      language: script
      pass_filenames: false
- repo: local
  hooks:
    # Keep the ty version in step with ty_version in .gitlab-ci/gitlab-ci.yml.
    # The dev container keeps its environment in UV_PROJECT_ENVIRONMENT, not in ty.toml's .venv.
    - id: ty
      name: ty (relative to baseline)
      language: system
      entry: |
        sh -c 'uv sync --project ucsschool-accounts --python 3.11 --quiet && \
          uvx ty@0.0.107 check --python "${UV_PROJECT_ENVIRONMENT:-ucsschool-accounts/.venv}"' --
      pass_filenames: false
      files: ^(ucsschool-accounts/.*\.py|ty\.toml|ty-baseline\.json)$
- repo: https://github.com/jackdewinter/pymarkdown
  rev: v0.9.15
  hooks:
    - id: pymarkdown
      args:
        - --disable-rules
        - MD013,MD024,MD034,MD041
        - scan
        # Rules pymarkdown: https://github.com/jackdewinter/pymarkdown/blob/main/docs/rules.md
        # Rules markdownlint: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md
        # MD013: Allow arbitrary line length
        # MD024: Allow duplicate headings
        # MD034: Allow bare URLs
        # MD041: First line in file should be a top level heading
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 'v0.3.4'
  hooks:
    - id: ruff
      args: [--fix]
    - id: ruff-format
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.13.6 # Check for the latest release on GitHub
  hooks:
    # Ensure uv lock is up-to-date
    - id: uv-lock
      files: ucsschool-accounts/pyproject.toml
      args: [ --project, ucsschool-accounts ]
- repo: https://git.knut.univention.de/univention/infrastructure/pre-commit-hooks/pre-commit-copyright
  rev: 0.2.1
  hooks:
    - id: reuse-toml-dry-run
    - id: reuse-toml
      stages: [ manual ]
    - id: update-copyright-year
      stages: [ manual ]
- repo: https://github.com/fsfe/reuse-tool
  rev: v6.2.0
  hooks:
    - id: reuse
      alias: reuse-annotate
      name: "reuse annotate"
      args: ["annotate", "-c", "Univention GmbH", "-l", "AGPL-3.0-only", "--skip-unrecognised", "--skip-existing", "--template", "univention"]
      pass_filenames: true
      description: "Annotate all unlicensed files as AGPL-3.0-only with Univention GmbH copyright"
      stages: [manual]
      # we have to specify everything already covered by REUSE.toml again due to
      # https://github.com/fsfe/reuse-tool/issues/1190
      # MAKE SURE THIS IS IN SYNC WITH REUSE.toml
      # every path below is already licensed via one of:
      #  - the manual [[annotations]] block at the top of REUSE.toml
      #  - a dedicated block further down (doc images, spelling wordlists, vendored code)
      # some are also uncommentable formats (json/csv/svg/png) where reuse-annotate
      # would otherwise create stray *.license sidecar files instead of skipping
      exclude: "^renovate[.]json$\
                |^ty-baseline[.]json$\
                |^appcenter-management/files/.*[.]json$\
                |^dev/data/.*[.]json$\
                |^dev/tests/.*[.]json$\
                |^dev/tests/.*[.]csv$\
                |^docs/ucsschool-accounts/spelling_wordlist$\
                |^docs/ucsschool-accounts/_static/.*[.]pdf$\
                |^ucsschool-accounts/uv[.]lock$\
                |^ucsschool-accounts/tests/data/.*[.]json$\
                |^ucsschool-accounts/ucsschool_accounts/static/vendor/alpine[.]min[.]js$\
                |^ucsschool-accounts/ucsschool_accounts/static/vendor/htmx[.]min[.]js$\
                |^ucsschool-accounts/ucsschool_accounts/static/vendor/univention-design-system[.]js$\
                |^ucsschool-accounts/ucsschool_accounts/static/vendor/univention-design-system[.]css$\
                "
      language_version: python3.11
    - id: reuse
      alias: reuse-lint
      stages: [manual]
      language_version: python3.11
    - id: reuse-lint-file
      language_version: python3.11
- repo: local
  hooks:
    - id: cerbos-policy-check-docker
      name: cerbos-policy-check (docker)
      description: "Lints and tests Cerbos policies via `cerbos compile`, using the cerbos docker-compose service"
      entry: dev/dev_run.sh task cerbos-compile
      language: script
      stages: [manual]
      pass_filenames: false
      files: '^appcenter-management/files/policies/'
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.3.0
  hooks:
    - id: conventional-pre-commit
      stages: [ commit-msg ]
      args: ["--strict"]
- repo: local
  hooks:
    - id: issue-reference
      stages: [ commit-msg ]
      name: issue-reference
      language: pygrep
      entry: '.*\n\n(Issue \w+(/[a-zA-Z_-]+)*#\d+|Bug #\d+)\n+(\n.*)*\Z'
      args: ["--multiline", "--negate"]
