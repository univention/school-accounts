# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
    - id: check-added-large-files
    - id: check-json
    - id: check-xml
    - id: check-yaml
    - id: check-toml
    - id: trailing-whitespace
    - id: pretty-format-json
      args: [--autofix]
- repo: https://github.com/psf/black-pre-commit-mirror
  rev: 24.1.1
  hooks:
    - id: black
      args: ["--config", "user-management-bff/pyproject.toml"]
      language_version: python3.11
- repo: https://github.com/PyCQA/bandit
  rev: 1.7.6
  hooks:
    - id: bandit
      exclude: "user-management-bff/tests|appcenter-management/scripts/test_*"
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.8.0
  hooks:
    - id: mypy
      args: ["--config-file=user-management-bff/pyproject.toml"]
      exclude: "docs/|tests/"
      additional_dependencies: [fastapi, loguru, pytest, types-requests]
- repo: local
  hooks:
    - id: bff-translation-check
      name: bff-translation-check
      entry: user-management-bff/scripts/check_translations.sh
      language: script
      pass_filenames: false
- repo: https://github.com/jackdewinter/pymarkdown
  rev: v0.9.15
  hooks:
    - id: pymarkdown
      args:
        - --disable-rules
        - MD013,MD024,MD034,MD041
        - scan
        # Rules pymarkdown: https://github.com/jackdewinter/pymarkdown/blob/main/docs/rules.md
        # Rules markdownlint: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md
        # MD013: Allow arbitrary line length
        # MD024: Allow duplicate headings
        # MD034: Allow bare URLs
        # MD041: First line in file should be a top level heading
- repo: https://github.com/charliermarsh/ruff-pre-commit
  rev: 'v0.3.4'
  hooks:
    - id: ruff
      args: [--fix]
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.11.21 # Check for the latest release on GitHub
  hooks:
    # Ensure uv lock is up-to-date
    - id: uv-lock
      files: user-management-bff/pyproject.toml
      args: [ --project, user-management-bff ]
    - id: uv-lock
      files: dev/tests/product-tests/pyproject.toml
      args: [ --project, dev/tests/product-tests ]
- repo: https://github.com/fsfe/reuse-tool
  rev: v5.0.2
  hooks:
    - id: reuse
- repo: local
  hooks:
    - id: frontend-type-check
      name: frontend-type-check
      files: \.([jt]sx?|vue)$  # *.js, *.jsx, *.ts and *.tsx, as well as .vue
      types: [ file ]
      language: node
      entry: "yarn --cwd user-management-ui type-check"
      pass_filenames: false
      additional_dependencies:
        - "yarn"
    - id: frontend-lint
      name: frontend-lint
      files: \.([jt]sx?|vue)$  # *.js, *.jsx, *.ts and *.tsx, as well as .vue
      types: [ file ]
      language: node
      entry: "yarn --cwd user-management-ui lint"
      pass_filenames: false
      additional_dependencies:
        - "yarn"
    - id: frontend-format
      name: frontend-format
      files: \.([jt]sx?|vue)$  # *.js, *.jsx, *.ts and *.tsx, as well as .vue
      types: [ file ]
      language: node
      entry: "yarn --cwd user-management-ui format"
      pass_filenames: false
      additional_dependencies:
        - "yarn"
- repo: https://github.com/anderseknert/pre-commit-opa
  rev: v1.5.1
  hooks:
    - id: opa-fmt
    - id: opa-check
      args: ["appcenter-management/files/conditions", ".cache/opa", "--ignore=\"*.json\""]
    - id: opa-test
      args: ["appcenter-management/files/conditions", ".cache/opa", "-v", "--ignore=\"*.json\""]
