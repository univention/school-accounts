include:
  - project: univention/infrastructure/docker-services
    file:
      - kaniko.yml
  - project: 'univention/dev/docs/sphinx-docker'
    file: 'pipeline/sphinx.yml'
  - project: univention/dev/internal/ucsschool-ci-utils
    file: fragments/openstack.yaml
  - component: $CI_SERVER_FQDN/univention/dev/internal/ucsschool-ci-utils/app-release@2
    inputs:
      app_id: "ucsschool-user-management"
      mail_sender: "ucsschool-maintainers@univention.de"
      author_alias: "UCS@school Team"
      changelog_link: "https://docs.software-univention.de/ucsschool-user-management-module/${APP_VERSION}/changelog.html"
      mail_recipient: "app-announcement@univention.de"
      chat_destination: "#ucsschool"
      ucs_base_version: "5.0"
      additional_update_appcenter_needs:
        - job: build_docker_image_user_management
        - job: build_appcenter_files
      appcenter_file_dir: "__appcenter/"
      release_tag_prefix: "release-"

variables:
  UV_VERSION: "0.11.21"
  DOC_TARGET_VERSION: "0.2.0"
  DOC_TARGET_NAME: "ucsschool-user-management-module"
  DOC_TARGET_PATH: "$DOC_TARGET_NAME/$DOC_TARGET_VERSION"
  DOCS_DIR: "docs/$DOC_TARGET_NAME"
  DEV_IMAGE_NAME: ci-image
  DEV_IMAGE_TAG: $CI_REGISTRY_IMAGE/$DEV_IMAGE_NAME:$CI_COMMIT_REF_SLUG
  PRE_COMMIT_HOME: .cache/pre-commit-home
  UV_CACHE_DIR: .cache/uv
  YARN_CACHE_FOLDER: .cache/yarn
  npm_config_cache: .cache/npm
  PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright

stages:
  - prepare
  - test
  - lint
  - build
  - release
  - merge
  - production
  - integration_test
  - cleanup

build_dev_image:
  stage: prepare
  needs: []
  extends: .kaniko
  variables:
    KANIKO_BUILD_CONTEXT: "$CI_PROJECT_DIR/dev"
    IMAGE_TAG: $DEV_IMAGE_TAG
    KANIKO_ARGS: --build-arg commit="$CI_COMMIT_SHA" --build-arg date="$CI_JOB_STARTED_AT" --skip-unused-stages --cache=true --cache-repo=$CI_REGISTRY_IMAGE/$DEV_IMAGE_NAME/cache

build_appcenter_files:
  stage: prepare
  script:
    - cd appcenter-management
    - ./scripts/generate-preinst
    - mkdir ../__appcenter
    - cp compose.jinja configure_host inst ini.jinja preinst README_UPDATE_DE README_UPDATE_EN settings uinst ../__appcenter
  artifacts:
    paths:
      - __appcenter

run_pre-commit:
  stage: lint
  needs: [build_dev_image]
  image: $DEV_IMAGE_TAG
  cache: &cache
    key: $CI_COMMIT_REF_SLUG
    paths:
      - .cache/
  before_script:
    PROJECT_DIR="." ./dev/scripts/install_deps.sh
  script:
    - pre-commit run -a

bff-test:
  stage: test
  needs: [build_dev_image]
  image: $DEV_IMAGE_TAG
  variables:
    BFF_COVERAGE_LIMIT: "100"
    UV_SYSTEM_PYTHON: 1 # installs deps to the system directly
  before_script:
    - ./user-management-bff/scripts/test_setup.sh
    - pip install uv=="$UV_VERSION"
    - uv pip install user-management-bff/
  rules:
    - when: manual
      allow_failure: true
    - changes:
        - user-management-bff/**/*
        - user-management-ui/**/*
  script:
    - uv run --project user-management-bff/ pytest -vv -m "not e2e" --junitxml=report.xml --cov --cov-config=user-management-bff/pyproject.toml --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under="$BFF_COVERAGE_LIMIT" user-management-bff/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: report.xml

ui-test:
  stage: test
  image: mcr.microsoft.com/playwright@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948 # 1.60.0-noble
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules
  before_script:
    - cd user-management-ui
    - corepack enable
    - yarn config set cache-folder .yarn
    - yarn install --prefer-offline --cache-folder .yarn
  script:
    - cp .env.example .env.production.local
    - yarn test:e2e:setup
    - PLAYWRIGHT_JUNIT_OUTPUT_NAME=../report.xml yarn test:e2e --reporter=junit,html
    - PLAYWRIGHT_JUNIT_OUTPUT_NAME=../report.xml ../dev/tests/playwright2gitlab_junit.py
  rules:
    - if: "$CI_COMMIT_MESSAGE =~ /skip-build/ || $pipeline =~ /skip-build/"
      when: never
    - if: "$CI_COMMIT_MESSAGE =~ /force-build/ || $pipeline =~ /force-build/"
    - changes:
        - user-management-bff/**/*
        - user-management-ui/**/*
  artifacts:
    reports:
      junit: report.xml
    paths:
      - user-management-ui/playwright-report/
    expose_as: "Playwright report"
    when: always

repo_tar:
  stage: prepare
  image: $EC2_TOOLS_IMAGE
  script:
    - git archive --format=tar --prefix user-management/ --output user-management.tar HEAD
  artifacts:
    paths:
      - user-management.tar

integration-tests:
  stage: integration_test
  extends: .run_openstack_cfg
  timeout: 2h
  needs:
    - job: repo_tar
    - job: create_app_version
    - job: update_appcenter
  rules:
    - changes:
        - user-management-bff/**/*
        - user-management-ui/**/*
        - appcenter-management/**/*
        - dev/tests/**/*
      when: manual
      allow_failure: true
    - when: manual
      allow_failure: true
  variables:
    TARGET_VERSION: "5.2-1"
    OPENSTACK_CFG_FILE: "dev/tests/integration_tests.cfg"
    PACKAGES_TO_INSTALL: ""
    UCSSCHOOL_USER_MANAGEMENT_VERSION: $APP_VERSION
    SSH_KEY: $SSH_PRIVATE_KEY_TECH
  artifacts:
    when: always
    paths:
      - primary_join.log
      - "*playwright-report"
      - "*_producttest_traces"
      - "*_kelvin_http.log"
    reports:
      junit: "*junit.xml"

bff-coverage:
  extends: bff-test
  variables:
    BFF_COVERAGE_LIMIT: "100"
    UV_SYSTEM_PYTHON: 1 # installs deps to the system directly
  before_script:
    - ./user-management-bff/scripts/test_setup.sh
    - pip install uv=="$UV_VERSION"
    - uv pip install user-management-bff/
  script:
    - uv run --project user-management-bff/ pytest -vv -m "not e2e" --cov --cov-config=user-management-bff/pyproject.toml --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under="$BFF_COVERAGE_LIMIT" user-management-bff/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build_docker_image_user_management:
  stage: prepare
  rules:
    - if: "$CI_COMMIT_TAG"
      variables:
        REGISTRY: "artifacts.software-univention.de"
        REGISTRY_IMAGE: "$REGISTRY/ucsschool/ucsschool-user-management"
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  extends: .kaniko
  variables:
    KANIKO_BUILD_CONTEXT: "$CI_PROJECT_DIR/"
    CI_REGISTRY_IMAGE: $CI_REGISTRY_IMAGE/ucsschool-user-management
    KANIKO_ARGS: --build-arg commit="$CI_COMMIT_SHA" --build-arg date="$CI_JOB_STARTED_AT" --skip-unused-stages --cache=true --cache-repo=$CI_REGISTRY_IMAGE/cache

docs-linkcheck:
  extends: .sphinx-linkcheck-template
  rules:
    - changes:
      - docs/ucsschool-user-management-module/**/*

docs-spelling:
  extends: .sphinx-spelling-template
  rules:
    - changes:
      - docs/ucsschool-user-management-module/**/*

docs-html:
  extends: .sphinx-html-template
  rules:
    - changes:
      - docs/ucsschool-user-management-module/**/*

docs-pdf:
  extends: .sphinx-pdf-template
  rules:
    - changes:
      - docs/ucsschool-user-management-module/**/*

docs-merge-to-one-artifact:
  extends: .sphinx-merge-template
  needs:
    - job: docs-html
    - job: docs-pdf
    - job: docs-spelling
      artifacts: false
    - job: docs-linkcheck
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
      - docs/ucsschool-user-management-module/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
      - docs/ucsschool-user-management-module/**/*
      when: manual

# The template has inherit:variables:false to prevent the passing of pipeline
# variables to downstream, and therefore $DOCS_DIR is not available here.
docs-create-production-merge-request:
  extends: .sphinx-docs-merge-request-template
  needs:
    - job: docs-merge-to-one-artifact
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
      - docs/**/*
