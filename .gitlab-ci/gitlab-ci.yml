include:
  - project: univention/dev/tooling/ci-components
    file: fragments/openstack.yaml
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/app-release@2.16.2
    inputs:
      app_id: "ucsschool-accounts"
      mail_sender: "ucsschool-maintainers@univention.de"
      author_alias: "The ByteBenders"
      changelog_link: "https://docs.software-univention.de/ucsschool-accounts/changelog.html"
      mail_recipient: "app-announcement@univention.de"
      chat_destination: "#product-announcements"
      ucs_base_version: "5.2"
      additional_update_appcenter_needs:
        - job: build_docker_image_ucsschool_accounts
        - job: build_appcenter_files
        - job: build_changelog_html
      appcenter_file_dir: "__appcenter/"
      release_tag_prefix: "release-"
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/buildkit@2.16.2
    inputs:
      job_name: "build_dev_image"
      stage: prepare
      # The development image is built for every pipeline, because the test jobs
      # run in it.
      job_rules:
        - when: on_success
      build_context: "$CI_PROJECT_DIR/dev"
      image_name: "$DEV_IMAGE_NAME"
      registry_image: "$CI_REGISTRY_IMAGE/$DEV_IMAGE_NAME"
      image_tag: "$DEV_IMAGE_TAG"
      image_tag_env_name: "DEV_IMAGE_TAG"
      build_args: |
        commit=$CI_COMMIT_SHA
        date=$CI_JOB_STARTED_AT
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/buildkit@2.16.2
    inputs:
      job_name: "build_docker_image_ucsschool_accounts"
      stage: prepare
      image_name: "ucsschool-accounts"
      registry_image: "$CI_REGISTRY_IMAGE/ucsschool-accounts"
      # Tag the released image with the plain version, without the tag prefix
      # that triggers the release pipeline.
      tag_prefix: "release-"
      # Keep the build cache in the project registry, also for the tag pipeline
      # that pushes the image itself to the public registry.
      cache_image: "$CI_REGISTRY_IMAGE/ucsschool-accounts/cache"
      job_rules:
        - if: "$CI_COMMIT_TAG"
          variables:
            REGISTRY: "artifacts.software-univention.de"
            REGISTRY_IMAGE: "$REGISTRY/ucsschool/ucsschool-accounts"
        - if: $CI_MERGE_REQUEST_ID
        - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      build_args: |
        commit=$CI_COMMIT_SHA
        date=$CI_JOB_STARTED_AT
        UCSSCHOOL_ACCOUNTS_BUILD_VERSION=$CI_COMMIT_TAG
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/pre-commit@2.16.2
    inputs:
      commit_msg_hooks: "conventional-pre-commit issue-reference"
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/python-type-hint-coverage-basedpyright@2.16.2
    inputs:
      job_prefix: "bff_"
      pipeline_stage: build
      python_paths: --project ucsschool-accounts-bff/pyrightconfig.json ucsschool-accounts-bff
      python_version: "3.11"
      basedpyright_version: "1.39.8"
      baseline_file: ucsschool-accounts-bff/basedpyright-baseline.json
      before_script:
        - uv sync --project ucsschool-accounts-bff --python 3.11
      job_rules:
        - if: $CI_MERGE_REQUEST_ID
          changes:
            - ucsschool-accounts-bff/**/*
        - if: $CI_COMMIT_REF_PROTECTED == "true"
        - if: $CI_COMMIT_TAG
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/sonarqube@2.16.2
    inputs:
      job_name: "build-sonar"
      stage: build
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/sphinx-docs@2.16.2
    inputs:
      docs_dir: "docs/ucsschool-accounts"
      doc_target_name: "ucsschool-accounts"
      job_rules:
        - changes: &docs_build_changes
            - "docs/ucsschool-accounts/**/*"
            - ".gitlab-ci/gitlab-ci.yml"
      merge_rules:
        - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
          changes: *docs_build_changes
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          changes: *docs_build_changes
          when: manual
        - if: $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"
          changes: *docs_build_changes
      production_rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          changes:
            - "docs/ucsschool-accounts/**/*"
        - if: $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"
          changes: *docs_build_changes

variables:
  UV_VERSION: "0.11.21"
  DEV_IMAGE_NAME: ci-image
  DEV_IMAGE_TAG: $CI_REGISTRY_IMAGE/$DEV_IMAGE_NAME:$CI_COMMIT_REF_SLUG
  PRE_COMMIT_HOME: .cache/pre-commit-home
  UV_CACHE_DIR: .cache/uv
  # Keep in sync with the version/checksum used in dev/docker-compose.yaml and
  # docker/pre_commit/check_cerbos_policies.sh.
  CERBOS_VERSION: "0.54.0"
  CERBOS_TARBALL_SHA256: "68ce48355cf1df125da9ff2b6c0b07d35781155d3aa1707707c381c2e454f156"

stages:
  - prepare
  - test
  - lint
  - build
  - release
  - merge
  - production
  - integration_test
  - cleanup

# The buildkit component has no input for the runner tags.
build_dev_image:
  tags: ["dae-m"]

build_docker_image_ucsschool_accounts:
  tags: ["dae-m"]

build_appcenter_files:
  stage: prepare
  script:
    - cd appcenter-management
    - ./scripts/generate-preinst
    - mkdir ../__appcenter
    - cp compose.jinja configure configure_host inst ini.jinja logo.svg preinst README_UPDATE_DE.jinja README_UPDATE_EN.jinja settings uinst ../__appcenter
  artifacts:
    paths:
      - __appcenter

build_changelog_html:
  stage: prepare
  image: gitregistry.knut.univention.de/univention/dev/docs/sphinx-docker/base@sha256:f4ae0cd320a7752163d5677e47d0bfbc44255cdc810c7b62ae854b7245294946
  script:
    - pip install lxml
    - ./appcenter-management/scripts/build-changelog-html
  artifacts:
    paths:
      - changelog.html

compile-policies:
  stage: test
  needs: []
  tags: ["dae-m"]
  image: debian:stable-slim
  variables:
    CERBOS_TARBALL: "cerbos_${CERBOS_VERSION}_Linux_x86_64.tar.gz"
    CERBOS_NO_TELEMETRY: "1"
  cache:
    key: "cerbos-${CERBOS_VERSION}"
    paths:
      - .cerbos-bin/
  rules:
    - changes:
        - appcenter-management/files/policies/**/*
  script:
    - |
      set -eu
      if [ ! -x .cerbos-bin/cerbos ]; then
        apt-get update
        apt-get install -y --no-install-recommends curl ca-certificates
        mkdir -p .cerbos-bin
        curl -fsSL -o /tmp/cerbos.tar.gz \
          "https://github.com/cerbos/cerbos/releases/download/v${CERBOS_VERSION}/${CERBOS_TARBALL}"
        echo "${CERBOS_TARBALL_SHA256}  /tmp/cerbos.tar.gz" | sha256sum -c -
        tar -xzf /tmp/cerbos.tar.gz -C .cerbos-bin cerbos
      fi
    - .cerbos-bin/cerbos compile --no-color appcenter-management/files/policies

test_appcenter_scripts:
  stage: test
  needs: []
  tags: ["dae-m"]
  image: debian:stable-slim
  rules:
    - changes:
        - appcenter-management/tests/**/*
        - appcenter-management/templates/**/*
        - appcenter-management/scripts/generate-preinst
  script:
    - |
      set -eu
      apt-get -qq update
      apt-get -yqq install --no-install-recommends python3 bats
    - mkdir -p bats-report
    - bats --report-formatter junit --output bats-report appcenter-management/tests/
  artifacts:
    when: always
    reports:
      junit: bats-report/report.xml

# Guards against editing a shipped Cerbos policy without bumping VERSION in
# appcenter-management/inst - see the script for why that combination fails
# silently on the target system.
policy-version-bump:
  stage: test
  needs: []
  tags: ["dae-m"]
  image: $EC2_TOOLS_IMAGE
  variables:
    # CI_MERGE_REQUEST_DIFF_BASE_SHA lies outside the default shallow clone.
    GIT_DEPTH: 0
  rules:
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - appcenter-management/files/policies/**/*
  script:
    - .gitlab-ci/scripts/check-policy-version-bump.sh

bff-test:
  stage: test
  needs: [build_dev_image]
  tags: ["dae-m"]
  image: $DEV_IMAGE_TAG
  variables:
    BFF_COVERAGE_LIMIT: "100"
    UV_SYSTEM_PYTHON: 1 # installs deps to the system directly
  before_script:
    - ./ucsschool-accounts-bff/scripts/test_setup.sh
    - pip install uv=="$UV_VERSION"
    - uv pip install ucsschool-accounts-bff/
  rules:
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - ucsschool-accounts-bff/**/*
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true
  script:
    - uv run --project ucsschool-accounts-bff/ pytest -vv -m "not e2e and not frontend" --junitxml=report.xml --cov --cov-config=ucsschool-accounts-bff/pyproject.toml --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under="$BFF_COVERAGE_LIMIT" ucsschool-accounts-bff/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: report.xml

bff-frontend-test:
  stage: test
  needs: [build_dev_image]
  tags: ["dae-m"]
  image: $DEV_IMAGE_TAG
  services:
    # Keep in sync with dev/Keycloak.Dockerfile.
    - name: gitregistry.knut.univention.de/univention/dev/projects/keycloak/keycloak-app/keycloak:26.7.4-nubus1@sha256:f7ce4d5346d494502e281607959767b657918f57dc01fa8d39b0a98661098bff
      alias: keycloak
      command: ["start"]
      variables:
        KC_DB: dev-file
        KC_HTTP_ENABLED: "true"
        KC_HTTP_RELATIVE_PATH: /keycloak
        KEYCLOAK_ADMIN: admin
        KEYCLOAK_ADMIN_PASSWORD: admin
        # Host-network runner, so localhost; without the path this overrides KC_HTTP_RELATIVE_PATH.
        KC_HOSTNAME: "http://localhost:8080/keycloak"
  variables:
    UV_SYSTEM_PYTHON: 1 # installs deps to the system directly
    KEYCLOAK_URL: "http://localhost:8080/keycloak"
    FRONTEND_BASE_URL: "http://localhost:8000"
    PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"
    # Take precedence over dev/.env.example, which addresses everything through the compose proxy.
    COOKIE_SESSION_AUTHENTICATION_ADAPTER__WELL_KNOWN_URL: "http://localhost:8080/keycloak/realms/ucs/.well-known/openid-configuration"
    COOKIE_SESSION_AUTHENTICATION_ADAPTER__REDIRECT_URL: "http://localhost:8000/univention/ucsschool/ucsschool-accounts/ui/auth/callback"
    COOKIE_SESSION_AUTHENTICATION_ADAPTER__POST_LOGOUT_REDIRECT_URL: "http://localhost:8000/univention/ucsschool/ucsschool-accounts/ui/auth/logged-out"
  cache:
    key:
      files:
        - ucsschool-accounts-bff/uv.lock
    paths:
      - .cache/ms-playwright/
  before_script:
    # dev/.env.example paths assume the compose bind mount at /src.
    - rmdir /src && ln -s "$CI_PROJECT_DIR" /src
    - ./ucsschool-accounts-bff/scripts/test_setup.sh
    - uv run --project ucsschool-accounts-bff/ playwright install chromium
    - curl -sf --retry 90 --retry-delay 2 --retry-all-errors -o /dev/null "$KEYCLOAK_URL/realms/master/.well-known/openid-configuration"
    - dev/scripts/provision_keycloak.sh
    - mkdir -p .cache
    - 'uv run --project ucsschool-accounts-bff/ --env-file dev/.env.example uvicorn --port 8000 ucsschool_accounts_bff.main:app > .cache/frontend-test-bff.log 2>&1 &'
    - curl -sf --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null "$FRONTEND_BASE_URL/univention/ucsschool/ucsschool-accounts/ui/"
  rules:
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - ucsschool-accounts-bff/**/*
        - dev/**/*
        - appcenter-management/files/ucsschool-accounts_client_ui.json
        - .gitlab-ci/gitlab-ci.yml
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true
  script:
    - uv run --project ucsschool-accounts-bff/ pytest -vv -m frontend --base-url "$FRONTEND_BASE_URL" --browser chromium --screenshot only-on-failure --tracing retain-on-failure --output .cache/frontend-test-results --junitxml=frontend-report.xml ucsschool-accounts-bff/tests/frontend
  artifacts:
    when: always
    paths:
      - .cache/frontend-test-bff.log
      - .cache/frontend-test-results/
    reports:
      junit: frontend-report.xml

repo_tar:
  stage: prepare
  image: $EC2_TOOLS_IMAGE
  script:
    - git archive --format=tar --prefix ucsschool-accounts/ --output ucsschool-accounts.tar HEAD
  artifacts:
    paths:
      - ucsschool-accounts.tar

integration-tests:
  stage: integration_test
  extends: .run_openstack_cfg
  timeout: 2h
  tags: ["dae-m"]
  needs:
    - job: repo_tar
    - job: create_app_version
    - job: update_appcenter
  rules:
    - changes:
        - ucsschool-accounts-bff/**/*
        - appcenter-management/**/*
        - dev/tests/**/*
      when: manual
      allow_failure: true
    - when: manual
      allow_failure: true
  variables:
    TARGET_VERSION: "5.2-6"
    OPENSTACK_CFG_FILE: "dev/tests/integration_tests.cfg"
    PACKAGES_TO_INSTALL: ""
    UCSSCHOOL_ACCOUNTS_VERSION: $APP_VERSION
    SSH_KEY: $SSH_PRIVATE_KEY_TECH
  script:
    - !reference [.run_openstack_cfg, script]
    # the test commands in the cfg file end in "|| true" so that the junit
    # reports are still fetched from the VM, this fails the job instead
    - dev/tests/parse_junit.py
  artifacts:
    when: always
    paths:
      - primary_join.log
      - "*_frontend_traces"
      - "*_kelvin_http.log"
    reports:
      junit: "*junit.xml"

pages:
  stage: production
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/busybox:latest
  variables:
    GIT_STRATEGY: none
  needs:
    - job: docs:html
    - job: docs:pdf
  script:
    - "true"
  pages:
    publish: "out/ucsschool-accounts"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *docs_build_changes
