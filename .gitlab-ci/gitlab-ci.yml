include:
  - project: 'univention/dev/docs/sphinx-docker'
    file: 'pipeline/sphinx.yml'
  - project: univention/dev/tooling/ci-components
    file: fragments/openstack.yaml
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/app-release@2.16.2
    inputs:
      app_id: "ucsschool-user-management"
      mail_sender: "ucsschool-maintainers@univention.de"
      author_alias: "The ByteBenders"
      changelog_link: "https://docs.software-univention.de/ucsschool-user-management-module/${APP_VERSION}/changelog.html"
      mail_recipient: "app-announcement@univention.de"
      chat_destination: "#ucsschool"
      ucs_base_version: "5.2"
      additional_update_appcenter_needs:
        - job: build_docker_image_user_management
        - job: build_appcenter_files
      appcenter_file_dir: "__appcenter/"
      release_tag_prefix: "release-"
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/buildkit@2.16.2
    inputs:
      job_name: "build_dev_image"
      stage: prepare
      # The development image is built for every pipeline, because the test jobs
      # run in it.
      job_rules:
        - when: on_success
      build_context: "$CI_PROJECT_DIR/dev"
      image_name: "$DEV_IMAGE_NAME"
      registry_image: "$CI_REGISTRY_IMAGE/$DEV_IMAGE_NAME"
      image_tag: "$DEV_IMAGE_TAG"
      image_tag_env_name: "DEV_IMAGE_TAG"
      build_args: |
        commit=$CI_COMMIT_SHA
        date=$CI_JOB_STARTED_AT
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/buildkit@2.16.2
    inputs:
      job_name: "build_docker_image_user_management"
      stage: prepare
      image_name: "ucsschool-user-management"
      registry_image: "$CI_REGISTRY_IMAGE/ucsschool-user-management"
      # Tag the released image with the plain version, without the tag prefix
      # that triggers the release pipeline.
      tag_prefix: "release-"
      # Keep the build cache in the project registry, also for the tag pipeline
      # that pushes the image itself to the public registry.
      cache_image: "$CI_REGISTRY_IMAGE/ucsschool-user-management/cache"
      job_rules:
        - if: "$CI_COMMIT_TAG"
          variables:
            REGISTRY: "artifacts.software-univention.de"
            REGISTRY_IMAGE: "$REGISTRY/ucsschool/ucsschool-user-management"
        - if: $CI_MERGE_REQUEST_ID
        - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      build_args: |
        commit=$CI_COMMIT_SHA
        date=$CI_JOB_STARTED_AT
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/buildkit@2.16.2
    inputs:
      job_name: "build_keycloak_image"
      stage: prepare
      # The frontend tests run against a real login, so the image backing the
      # Keycloak service container is built for every pipeline, like the dev image.
      job_rules:
        - when: on_success
      build_context: "$CI_PROJECT_DIR/dev"
      dockerfile_path: "$CI_PROJECT_DIR/dev/Keycloak.Dockerfile"
      image_name: "$KEYCLOAK_IMAGE_NAME"
      registry_image: "$CI_REGISTRY_IMAGE/$KEYCLOAK_IMAGE_NAME"
      image_tag: "$KEYCLOAK_IMAGE_TAG"
      image_tag_env_name: "KEYCLOAK_IMAGE_TAG"
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/pre-commit@2.16.2
    inputs:
      commit_msg_hooks: "conventional-pre-commit issue-reference"
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/python-type-hint-coverage-basedpyright@2.16.2
    inputs:
      job_prefix: "bff_"
      pipeline_stage: build
      python_paths: --project user-management-bff/pyrightconfig.json user-management-bff
      python_version: "3.11"
      basedpyright_version: "1.39.8"
      baseline_file: user-management-bff/basedpyright-baseline.json
      before_script:
        - uv sync --project user-management-bff --python 3.11
      job_rules:
        - if: $CI_MERGE_REQUEST_ID
          changes:
            - user-management-bff/**/*
        - if: $CI_COMMIT_REF_PROTECTED == "true"
        - if: $CI_COMMIT_TAG
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/sonarqube@2.16.2
    inputs:
      job_name: "build-sonar"
      stage: build

variables:
  UV_VERSION: "0.11.21"
  DOC_TARGET_VERSION: "0.2.0"
  DOC_TARGET_NAME: "ucsschool-user-management-module"
  DOC_TARGET_PATH: "$DOC_TARGET_NAME/$DOC_TARGET_VERSION"
  DOCS_DIR: "docs/$DOC_TARGET_NAME"
  DEV_IMAGE_NAME: ci-image
  DEV_IMAGE_TAG: $CI_REGISTRY_IMAGE/$DEV_IMAGE_NAME:$CI_COMMIT_REF_SLUG
  KEYCLOAK_IMAGE_NAME: ci-keycloak
  KEYCLOAK_IMAGE_TAG: $CI_REGISTRY_IMAGE/$KEYCLOAK_IMAGE_NAME:$CI_COMMIT_REF_SLUG
  PRE_COMMIT_HOME: .cache/pre-commit-home
  UV_CACHE_DIR: .cache/uv
  # Keep in sync with the version/checksum used in dev/docker-compose.yaml and
  # docker/pre_commit/check_cerbos_policies.sh.
  CERBOS_VERSION: "0.54.0"
  CERBOS_TARBALL_SHA256: "68ce48355cf1df125da9ff2b6c0b07d35781155d3aa1707707c381c2e454f156"

stages:
  - prepare
  - test
  - lint
  - build
  - release
  - merge
  - production
  - integration_test
  - cleanup

# The buildkit component has no input for the runner tags.
build_dev_image:
  tags: ["dae-m"]

build_docker_image_user_management:
  tags: ["dae-m"]

build_keycloak_image:
  tags: ["dae-m"]

build_appcenter_files:
  stage: prepare
  script:
    - cd appcenter-management
    - ./scripts/generate-preinst
    - mkdir ../__appcenter
    - cp compose.jinja configure configure_host inst ini.jinja logo.svg preinst README_UPDATE_DE README_UPDATE_EN settings uinst ../__appcenter
  artifacts:
    paths:
      - __appcenter

compile-policies:
  stage: test
  needs: []
  tags: ["dae-m"]
  image: debian:stable-slim
  variables:
    CERBOS_TARBALL: "cerbos_${CERBOS_VERSION}_Linux_x86_64.tar.gz"
    CERBOS_NO_TELEMETRY: "1"
  cache:
    key: "cerbos-${CERBOS_VERSION}"
    paths:
      - .cerbos-bin/
  rules:
    - changes:
        - appcenter-management/files/policies/**/*
  script:
    - |
      set -eu
      if [ ! -x .cerbos-bin/cerbos ]; then
        apt-get update
        apt-get install -y --no-install-recommends curl ca-certificates
        mkdir -p .cerbos-bin
        curl -fsSL -o /tmp/cerbos.tar.gz \
          "https://github.com/cerbos/cerbos/releases/download/v${CERBOS_VERSION}/${CERBOS_TARBALL}"
        echo "${CERBOS_TARBALL_SHA256}  /tmp/cerbos.tar.gz" | sha256sum -c -
        tar -xzf /tmp/cerbos.tar.gz -C .cerbos-bin cerbos
      fi
    - .cerbos-bin/cerbos compile --no-color appcenter-management/files/policies

# Guards against editing a shipped Cerbos policy without bumping VERSION in
# appcenter-management/inst - see the script for why that combination fails
# silently on the target system.
policy-version-bump:
  stage: test
  needs: []
  tags: ["dae-m"]
  image: $EC2_TOOLS_IMAGE
  variables:
    # CI_MERGE_REQUEST_DIFF_BASE_SHA lies outside the default shallow clone.
    GIT_DEPTH: 0
  rules:
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - appcenter-management/files/policies/**/*
  script:
    - .gitlab-ci/scripts/check-policy-version-bump.sh

bff-test:
  stage: test
  needs: [build_dev_image]
  tags: ["dae-m"]
  image: $DEV_IMAGE_TAG
  variables:
    BFF_COVERAGE_LIMIT: "100"
    UV_SYSTEM_PYTHON: 1 # installs deps to the system directly
  before_script:
    - ./user-management-bff/scripts/test_setup.sh
    - pip install uv=="$UV_VERSION"
    - uv pip install user-management-bff/
  rules:
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - user-management-bff/**/*
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true
  script:
    - uv run --project user-management-bff/ pytest -vv -m "not e2e and not frontend" --junitxml=report.xml --cov --cov-config=user-management-bff/pyproject.toml --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under="$BFF_COVERAGE_LIMIT" user-management-bff/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: report.xml

# Drives a real browser against a real login. Keycloak runs as a service
# container and the BFF is started next to it on the File adapters and the dev
# fixture data, so the job covers the login redirect chain, the design system's
# custom elements and the htmx swaps - none of which the in-process tests reach.
# Kelvin and Cerbos are not part of it; those stay with the integration tests.
bff-frontend-test:
  stage: test
  needs: [build_dev_image, build_keycloak_image]
  tags: ["dae-m"]
  image: $DEV_IMAGE_TAG
  services:
    - name: $KEYCLOAK_IMAGE_TAG
      alias: keycloak
      command: ["start"]
      variables:
        # The image is built for the compose stack, where Keycloak is addressed
        # through the proxy. Here the issuer has to match KEYCLOAK_URL below or
        # the redirect chain breaks, and both say localhost: these runners create
        # service containers in host network mode, where the `keycloak` alias
        # never resolves and the service is reachable on the job's own loopback.
        # Spelling the path out is required either way: a hostname URL without
        # one overrides KC_HTTP_RELATIVE_PATH, and the discovery document then
        # advertises endpoints that are not served.
        KC_HOSTNAME: "http://localhost:8080/keycloak"
  variables:
    UV_SYSTEM_PYTHON: 1 # installs deps to the system directly
    # The dev image bakes PROJECT_DIR=/src for the compose bind mount.
    PROJECT_DIR: $CI_PROJECT_DIR
    KEYCLOAK_URL: "http://localhost:8080/keycloak"
    FRONTEND_BASE_URL: "http://localhost:8000"
    PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"
  cache:
    key:
      files:
        - user-management-bff/uv.lock
    paths:
      - .cache/ms-playwright/
  before_script:
    - ./user-management-bff/scripts/test_setup.sh
    - uv run --project user-management-bff/ playwright install chromium
    - ./dev/scripts/start_frontend_test_stack.sh
  rules:
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - user-management-bff/**/*
        - dev/**/*
        - appcenter-management/files/ucsschool-user-management_client_ui.json
        - .gitlab-ci/gitlab-ci.yml
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true
  script:
    - uv run --project user-management-bff/ pytest -vv -m frontend --base-url "$FRONTEND_BASE_URL" --browser chromium --screenshot only-on-failure --tracing retain-on-failure --output .cache/frontend-test-results --junitxml=frontend-report.xml user-management-bff/tests/frontend
  artifacts:
    when: always
    paths:
      - .cache/frontend-test-bff.log
      - .cache/frontend-test-results/
    reports:
      junit: frontend-report.xml

repo_tar:
  stage: prepare
  image: $EC2_TOOLS_IMAGE
  script:
    - git archive --format=tar --prefix user-management/ --output user-management.tar HEAD
  artifacts:
    paths:
      - user-management.tar

integration-tests:
  stage: integration_test
  extends: .run_openstack_cfg
  timeout: 2h
  tags: ["dae-m"]
  needs:
    - job: repo_tar
    - job: create_app_version
    - job: update_appcenter
  rules:
    - changes:
        - user-management-bff/**/*
        - appcenter-management/**/*
        - dev/tests/**/*
      when: manual
      allow_failure: true
    - when: manual
      allow_failure: true
  variables:
    TARGET_VERSION: "5.2-6"
    OPENSTACK_CFG_FILE: "dev/tests/integration_tests.cfg"
    PACKAGES_TO_INSTALL: ""
    UCSSCHOOL_USER_MANAGEMENT_VERSION: $APP_VERSION
    SSH_KEY: $SSH_PRIVATE_KEY_TECH
  script:
    - !reference [.run_openstack_cfg, script]
    # the test commands in the cfg file end in "|| true" so that the junit
    # reports are still fetched from the VM, this fails the job instead
    - dev/tests/parse_junit.py
  artifacts:
    when: always
    paths:
      - primary_join.log
      - "*_frontend_traces"
      - "*_kelvin_http.log"
    reports:
      junit: "*junit.xml"

docs-linkcheck:
  extends: .sphinx-linkcheck-template
  rules:
    - changes:
      - docs/ucsschool-user-management-module/**/*

docs-spelling:
  extends: .sphinx-spelling-template
  rules:
    - changes:
      - docs/ucsschool-user-management-module/**/*

docs-html:
  extends: .sphinx-html-template
  rules:
    - changes:
      - docs/ucsschool-user-management-module/**/*

docs-pdf:
  extends: .sphinx-pdf-template
  rules:
    - changes:
      - docs/ucsschool-user-management-module/**/*

docs-merge-to-one-artifact:
  extends: .sphinx-merge-template
  needs:
    - job: docs-html
    - job: docs-pdf
    - job: docs-spelling
      artifacts: false
    - job: docs-linkcheck
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
      - docs/ucsschool-user-management-module/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
      - docs/ucsschool-user-management-module/**/*
      when: manual

# The template has inherit:variables:false to prevent the passing of pipeline
# variables to downstream, and therefore $DOCS_DIR is not available here.
docs-create-production-merge-request:
  extends: .sphinx-docs-merge-request-template
  needs:
    - job: docs-merge-to-one-artifact
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
      - docs/**/*
