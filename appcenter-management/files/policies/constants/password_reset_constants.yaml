#
# The single place that enumerates who may reset whose password.
#
# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json

apiVersion: "api.cerbos.dev/v1"
description: |-
  Who may reset whose password, and under which relationship
exportConstants:
  name: ucsschool_password_reset
  definitions:
    # Resource role -> principal role -> the relationships that must hold between
    # those two role entries. The relationship names are implemented in
    # school_user_resource.yaml: they are predicates over the *pair* of entries,
    # and a CEL variable takes no parameters.
    #
    # A reset needs a cell for *every* role its resource holds, so an absent role
    # protects its holder's password from everyone - school_admin, and any role
    # the directory service invents. An empty principal map means the same thing
    # for one role: nobody listed, nobody may reset.
    #
    # A cell names a role, not a role at a school. school_user_resource.yaml adds
    # the school: the principal role a cell names counts only at a school the
    # resource is enrolled in, so a role held somewhere the resource has never
    # been grants nothing here.
    #
    # staff and legal_guardian grant their holder nothing - staff has no derived
    # role, and no cell names either as a principal role. They still protect: a
    # teacher may reset students, so a pupil who is also staff, or who is a
    # guardian, is out of their teacher's reach and only their school_admin can
    # reset them. Granting nothing and being freely resettable are separate
    # questions, and only the school_admin cell answers the second one here.
    password_reset_matrix:
      student:
        teacher: ["same_school", "same_class"]
        school_admin: ["same_school"]
      teacher:
        school_admin: ["same_school"]
      staff:
        school_admin: ["same_school"]
      legal_guardian:
        school_admin: ["same_school"]
