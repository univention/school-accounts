# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: "ucsschool:class"
  importDerivedRoles:
    - ucsschool_derived_roles
  rules:
    # Any ucsschool user may use a school_class they're a member of as a search filter.
    - name: member_filters_by_own_class
      actions:
        - use-as-filter
      effect: EFFECT_ALLOW
      roles:
        - ucsschool:user
      condition:
        match:
          expr: >-
            P.attr.school_classes.exists(
              school,
              classes,
              R.attr.old.school == school && R.id in classes
            )
    # A school_admin may filter by any school_class in their own school.
    - name: school_admin_filters_by_any_class_in_own_school
      actions:
        - use-as-filter
      effect: EFFECT_ALLOW
      derivedRoles:
        - school_admin
