# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: "ucsschool:school"
  importDerivedRoles:
    - ucsschool_derived_roles
  rules:
    # Any ucsschool user enrolled in a school may use it as a search filter.
    - actions:
        - use-as-filter
      effect: EFFECT_ALLOW
      roles:
        - ucsschool:user
      condition:
        match:
          expr: R.id in P.attr.schools
