#
# Cerbos policy tests for work_groups_resource.yaml, run via
# `cerbos compile` (not shipped in the LDAP bundle - Cerbos ignores *_test.yaml as policies).
#
# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/TestSuite.schema.json

name: WorkGroupsResourceTests
description: Locks in configure_guardian.py's "*-member-groups-as-filters" and "school_admin-groups-as-filters" capabilities for the "ucsschool:workgroup" resource.

principals:
  bob_member_of_chess_club:
    id: bob
    roles: ["ucsschool:user"]
    attr:
      cerbos_roles: []
      schools: ["school1"]
      school_classes: {}
      work_groups:
        school1: ["chess-club"]

  carol_member_of_art_club:
    id: carol
    roles: ["ucsschool:user"]
    attr:
      cerbos_roles: []
      schools: ["school1"]
      school_classes: {}
      work_groups:
        school1: ["art-club"]

  dave_school_admin_school1:
    id: dave
    roles: ["ucsschool:user"]
    attr:
      cerbos_roles:
        - {name: school_admin, context: school1}
      schools: ["school1"]
      school_classes: {}
      work_groups: {}

resources:
  chess_club_school1:
    id: chess-club
    kind: "ucsschool:workgroup"
    attr:
      app_name: ucsschool-user-management
      old:
        school: school1
        cerbos_roles:
          - {name: workgroup, context: school1}

  robotics_club_school2:
    id: robotics-club
    kind: "ucsschool:workgroup"
    attr:
      app_name: ucsschool-user-management
      old:
        school: school2
        cerbos_roles:
          - {name: workgroup, context: school2}

tests:
  - name: a member of the work group can use it as a filter, a non-member cannot
    input:
      principals: [bob_member_of_chess_club, carol_member_of_art_club]
      resources: [chess_club_school1]
      actions: [use-as-filter]
    expected:
      - principal: bob_member_of_chess_club
        resource: chess_club_school1
        actions:
          use-as-filter: EFFECT_ALLOW
      - principal: carol_member_of_art_club
        resource: chess_club_school1
        actions:
          use-as-filter: EFFECT_DENY

  - name: school_admin can use any work group in their school as a filter, not another school's
    input:
      principals: [dave_school_admin_school1]
      resources: [chess_club_school1, robotics_club_school2]
      actions: [use-as-filter]
    expected:
      - principal: dave_school_admin_school1
        resource: chess_club_school1
        actions:
          use-as-filter: EFFECT_ALLOW
      - principal: dave_school_admin_school1
        resource: robotics_club_school2
        actions:
          use-as-filter: EFFECT_DENY
