# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: "ucsschool:user"
  importDerivedRoles:
    - ucsschool_derived_roles
  constants:
    import:
      - ucsschool_password_reset
  variables:
    local:
      teacher_of_student_in_same_class: >-
        P.attr.cerbos_roles.exists(
          p_role,
          p_role.name == "teacher" &&
          R.attr.old.cerbos_roles.exists(
            r_role,
            r_role.name == "student" &&
            r_role.context == p_role.context
          ) &&
          "school_classes" in P.attr &&
          p_role.context in P.attr.school_classes &&
          "school_classes" in R.attr.old &&
          p_role.context in R.attr.old.school_classes &&
          hasIntersection(
            P.attr.school_classes[p_role.context],
            R.attr.old.school_classes[p_role.context]
          )
        )
      guardian_of_ward: >-
        "legal_guardians" in R.attr.old &&
        P.id in R.attr.old.legal_guardians
      principal_holds_a_non_student_role: >-
        P.attr.cerbos_roles.exists(p_role, p_role.name != "student")
      is_self: R.id == P.id
      principal_may_reset_every_resource_role: >-
        size(R.attr.old.cerbos_roles) > 0 &&
        R.attr.old.cerbos_roles.all(
          r_role,
          r_role.name in C.password_reset_matrix &&
          P.attr.cerbos_roles.exists(
            p_role,
            p_role.name in C.password_reset_matrix[r_role.name] &&
            R.attr.old.cerbos_roles.exists(
              enrolment,
              enrolment.context == p_role.context
            ) &&
            size(C.password_reset_matrix[r_role.name][p_role.name]) > 0 &&
            C.password_reset_matrix[r_role.name][p_role.name].all(
              relation,
              relation == "same_school" || (
                relation == "same_class" &&
                "school_classes" in P.attr &&
                p_role.context in P.attr.school_classes &&
                "school_classes" in R.attr.old &&
                p_role.context in R.attr.old.school_classes &&
                hasIntersection(
                  P.attr.school_classes[p_role.context],
                  R.attr.old.school_classes[p_role.context]
                )
              )
            )
          )
        )
      resource_is_student_only: >-
        size(R.attr.old.cerbos_roles) > 0 &&
        R.attr.old.cerbos_roles.all(r_role, r_role.name == "student")
  rules:
    - name: non_student_reads_own_data
      actions:
        - read-last_name
        - read-first_name
        - read-disabled
        - read-activated
        - read-schools
        - read-school_classes
        - read-work_groups
        - read-roles
        - read-email
        - read-birthday
        - read-expiration_date
      effect: EFFECT_ALLOW
      derivedRoles:
        - self
      condition:
        match:
          expr: variables.principal_holds_a_non_student_role
    - name: teachers_read_students_in_same_class
      actions:
        - read-last_name
        - read-first_name
        - read-disabled
        - read-activated
        - read-schools
        - read-school_classes
        - read-work_groups
        - read-roles
        - read-email
        - read-birthday
        - read-expiration_date
      effect: EFFECT_ALLOW
      derivedRoles:
        - teacher
      # No !is_self guard, deliberately: a teacher is never student-only, so
      # non_student_reads_own_data already grants this exact action list on their
      # own record. A guard here would restrict nothing.
      condition:
        match:
          expr: variables.teacher_of_student_in_same_class
    - name: school_admin_reads_users_in_same_school
      actions:
        - read-last_name
        - read-first_name
        - read-disabled
        - read-activated
        - read-schools
        - read-school_classes
        - read-work_groups
        - read-roles
        - read-email
        - read-birthday
        - read-expiration_date
      effect: EFFECT_ALLOW
      derivedRoles:
        - school_admin
    - name: legal_guardian_reads_ward
      actions:
        - read-last_name
        - read-first_name
        - read-disabled
        - read-activated
        - read-schools
        - read-school_classes
        - read-work_groups
        - read-roles
        - read-email
        - read-birthday
        - read-expiration_date
      effect: EFFECT_ALLOW
      roles:
        - "ucsschool:user"
      condition:
        match:
          expr: >-
            variables.guardian_of_ward &&
            !variables.is_self
    - name: password_reset
      actions:
        - write-password
      effect: EFFECT_ALLOW
      roles:
        - "ucsschool:user"
      condition:
        match:
          expr: >-
            !variables.is_self &&
            (
              variables.principal_may_reset_every_resource_role ||
              (
                variables.guardian_of_ward &&
                variables.resource_is_student_only
              )
            )
