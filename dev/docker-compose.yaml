services:
  install_deps:
    image: ucsschool-user-management-dev:latest
    build: &docker-build
      dockerfile: dev/Dockerfile
      context: ../
    container_name: ucsschool-user-management-install_deps
    command: ["dev/scripts/install_deps.sh"]
    profiles:
      - clean-profile
      - dev-server
    user: $DOCKER_USER
    extra_hosts:
      - git.knut.univention.de:${GITLAB_IP}
    volumes: &default-volumes
      - ../:/src
    env_file: &env-files
      - path: .env
  run_command:
    image: ucsschool-user-management-dev:latest
    build: *docker-build
    container_name: ucsschool-user-management-run_command
    command: [ "echo", "'You should provide a command.'" ]
    profiles:
      - clean-profile
    depends_on:
      install_deps:
        condition: service_completed_successfully
    user: $DOCKER_USER
    extra_hosts:
      - git.knut.univention.de:${GITLAB_IP}
    volumes: *default-volumes
    env_file: *env-files
  proxy:
    image: traefik:v2.11
    container_name: ucsschool-user-management-proxy
    command:
      - --providers.docker
      - --entryPoints.web.address=:80
      - --entryPoints.api.address=:8000
    profiles:
      - clean-profile
      - dev-server
      - sphinx
    ports:
      - "80:80"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: *env-files
  bff:
    image: ucsschool-user-management-dev:latest
    build: *docker-build
    container_name: ucsschool-user-management-bff
    command:
      - "poetry"
      - "-C"
      - "user-management-bff"
      - "run"
      - "uvicorn"
      - "--reload"
      - "--log-level"
      - "debug"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "user_management_bff.main:app"
    profiles:
      - clean-profile
      - dev-server
    depends_on:
      install_deps:
        condition: service_completed_successfully
      proxy:
        condition: service_started
    user: $DOCKER_USER
    volumes: *default-volumes
    env_file: *env-files
    labels:
      traefik.http.routers.bff.entrypoints: api
      traefik.http.routers.bff.rule: PathPrefix(`${USER_MANAGEMENT__API_PREFIX}`)
      traefik.http.routers.bff.service: bff
      traefik.http.services.bff.loadbalancer.server.port: 8000
  ui:
    image: ucsschool-user-management-dev:latest
    build: *docker-build
    container_name: ucsschool-user-management-ui
    command: ["yarn", "--cwd", "user-management-ui", "dev"]
    profiles:
      - clean-profile
      - dev-server
    depends_on:
      install_deps:
        condition: service_completed_successfully
      proxy:
        condition: service_started
    user: $DOCKER_USER
    volumes: *default-volumes
    env_file: *env-files
    labels:
      traefik.http.routers.ui.entrypoints: web
      traefik.http.routers.ui.rule: PathPrefix(`/`)
      traefik.http.routers.ui.service: ui
      traefik.http.services.ui.loadbalancer.server.port: 5173
  sphinx:
    image: docker-registry.knut.univention.de/sphinx:latest
    pull_policy: always
    container_name: ucsschool-user-management-sphinx
    command: ["make", "-C", "docs/user-management-manual/", "livehtml"]
    working_dir: /project
    profiles:
      - sphinx
      - clean-profile
    depends_on:
      proxy:
        condition: service_started
    user: $DOCKER_USER
    volumes:
      - ../:/project
    labels:
      traefik.http.routers.sphinx.entrypoints: web
      traefik.http.routers.sphinx.rule: PathPrefix(`/docs/manual`)
      traefik.http.middlewares.strip-manual.stripprefix.prefixes: /docs/manual
      traefik.http.routers.sphinx.middlewares: strip-manual
      traefik.http.routers.sphinx.service: sphinx
      traefik.http.services.sphinx.loadbalancer.server.port: 8080
    env_file: *env-files
    environment:
      SPHINXOPTS: "--host 0.0.0.0 --port 8080"
