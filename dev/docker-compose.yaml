name: ucsschool-accounts
services:
  install_deps:
    image: ucsschool-accounts-dev:latest
    build: &docker-build
      dockerfile: dev/Dockerfile
      context: ../
    container_name: ucsschool-accounts-install_deps
    environment: &uv-project-environment
      # The repo is bind-mounted at /src here, but lives at a different absolute path on the host
      # (and in the dev container), and uv bakes absolute interpreter paths into the venv's
      # console-script shebangs. Sharing one `.venv` across both therefore breaks whichever side
      # did not build it last -- e.g. `uv run uvicorn` failing with "Failed to spawn: `uvicorn`".
      # Give the compose stack its own environment directory. Same reasoning as
      # docker/pre_commit/run-basedpyright.sh, but a distinct directory so a basedpyright run
      # cannot re-sync the environment of a running dev server.
      UV_PROJECT_ENVIRONMENT: /src/ucsschool-accounts-bff/.compose_venv
    command: ["dev/scripts/install_deps.sh"]
    profiles:
      - clean-profile
      - dev-server
      - kelvin-server
      - prod-server
    user: $DOCKER_USER
    extra_hosts: &extra_hosts
      - git.knut.univention.de:${GITLAB_IP}
      - host.docker.internal:host-gateway
    volumes: &default-volumes
      - ../:/src
    env_file: &env-files
      - path: .env
  run_command:
    image: ucsschool-accounts-dev:latest
    build: *docker-build
    container_name: ucsschool-accounts-run_command
    environment: *uv-project-environment
    command: [ "echo", "'You should provide a command.'" ]
    profiles:
      - clean-profile
    depends_on:
      install_deps:
        condition: service_completed_successfully
    user: $DOCKER_USER
    extra_hosts: *extra_hosts
    volumes: *default-volumes
    env_file: *env-files
  cerbos:
    image: ghcr.io/cerbos/cerbos:0.54.0
    container_name: ucsschool-accounts-cerbos
    profiles:
      - clean-profile
      - cerbos-server
      - kelvin-server
    ports:
      - "3592:3592"
      - "3593:3593"
    volumes:
      - ../appcenter-management/files/policies:/policies:ro
    command:
      - "server"
      - "--set=storage.driver=disk"
      - "--set=storage.disk.directory=/policies"
      # Watch for changes so editing a policy file takes effect live, without restarting the container.
      - "--set=storage.disk.watchForChanges=true"
      - "--set=telemetry.disabled=true"
      # Decision logs go to this container's stdout by default once enabled (audit.file.path
      # defaults to "stdout") - lets `docker compose logs cerbos` show the full evaluation trace
      # (matched policies, effective derived roles) for a call_id logged by the BFF adapter's
      # CerbosPermissionsAdapter.get_permissions.
      # Production Cerbos Guardian installed via Univention App Center supports this setting via
      # (boolean) UCR variable: `guardian/cerbos/audit-logging/enabled`.
      - "--set=audit.enabled=true"
      - "--set=audit.backend=file"
  proxy:
    image: traefik:v2.11
    container_name: ucsschool-accounts-proxy
    hostname: ucsschool-accounts-proxy
    command:
      - --providers.docker
      - --entryPoints.web.address=:80
    profiles:
      - clean-profile
      - dev-server
      - kelvin-server
      - sphinx
      - prod-server
    extra_hosts: *extra_hosts
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: *env-files
  keycloak_provisioning:
    image: ucsschool-accounts-dev:latest
    build: *docker-build
    container_name: ucsschool-accounts-keycloak_provisioning
    environment: *uv-project-environment
    command: ["dev/scripts/provision_keycloak.sh"]
    profiles:
      - clean-profile
      - dev-server
      - prod-server
    depends_on:
      install_deps:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    user: $DOCKER_USER
    extra_hosts: *extra_hosts
    volumes: *default-volumes
    env_file: *env-files
  keycloak:
    container_name: ucsschool-accounts-keycloak
    image: ucsschool-accounts-keycloak:latest
    build:
      context: ./
      dockerfile: Keycloak.Dockerfile
    hostname: keycloak
    command: start
    profiles:
      - clean-profile
      - dev-server
      - prod-server
    healthcheck:
      test: "/opt/keycloak/bin/kcadm.sh get realms/master --server http://localhost:8080/keycloak --realm master --user admin --password admin"
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 40s
      start_interval: 2s
    depends_on:
      proxy:
        condition: service_started
    labels:
      traefik.http.routers.keycloak.entrypoints: web
      traefik.http.routers.keycloak.rule: PathPrefix(`/keycloak`)
      traefik.http.routers.keycloak.service: keycloak
      traefik.http.services.keycloak.loadbalancer.server.port: 8080
      traefik.http.middlewares.customheaders.headers.customrequestheaders.X-Forwarded-Proto: http
      traefik.http.routers.keycloak.middlewares: customheaders
  bff:
    image: ucsschool-accounts-dev:latest
    build: *docker-build
    container_name: ucsschool-accounts-bff
    environment: *uv-project-environment
    command: &bff-command
      - "uv"
      - "run"
      - "--project"
      - "ucsschool-accounts-bff"
      - "uvicorn"
      - "--reload"
      - "--reload-dir"
      - "ucsschool-accounts-bff/ucsschool_accounts_bff"
      - "--log-level"
      - "debug"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "ucsschool_accounts_bff.main:app"
    profiles:
      - clean-profile
      - dev-server
    healthcheck:
      test: "curl -sf -o /dev/null http://localhost:8000/univention/ucsschool/ucsschool-accounts/ui/"
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 40s
      start_interval: 2s
    depends_on:
      install_deps:
        condition: service_completed_successfully
      proxy:
        condition: service_started
      keycloak_provisioning:
        condition: service_completed_successfully
    user: $DOCKER_USER
    extra_hosts: *extra_hosts
    volumes: *default-volumes
    env_file: *env-files
    labels: &bff-labels
      traefik.http.routers.bff.entrypoints: web
      traefik.http.routers.bff.rule: PathPrefix(`${UCSSCHOOL_ACCOUNTS__API_PREFIX}`) || PathPrefix(`/univention/ucsschool/ucsschool-accounts/ui`)
      traefik.http.routers.bff.service: bff
      traefik.http.services.bff.loadbalancer.server.port: 8000
    develop: &bff-develop
      watch:
        # backend project
        - action: sync
          path: ../ucsschool-accounts-bff
          target: /src/ucsschool-accounts-bff
        # backend dependencies
        - action: rebuild
          path: ../ucsschool-accounts-bff/pyproject.toml
        - action: rebuild
          path: ../ucsschool-accounts-bff/uv.lock
        # dev Dockerfile
        - action: rebuild
          path: Dockerfile
  # The same dev server as `bff`, wired to a real Kelvin and a real Cerbos
  # instead of the file adapters, and with no interactive login, so a page can
  # be measured against a populated environment with plain curl. `.env.kelvin`
  # carries the overrides and comes after `.env`, so it wins.
  bff_kelvin:
    image: ucsschool-accounts-dev:latest
    build: *docker-build
    container_name: ucsschool-accounts-bff-kelvin
    environment: *uv-project-environment
    command: *bff-command
    profiles:
      - clean-profile
      - kelvin-server
    depends_on:
      install_deps:
        condition: service_completed_successfully
      proxy:
        condition: service_started
      cerbos:
        condition: service_started
    user: $DOCKER_USER
    # A container sees neither the host's /etc/hosts nor necessarily a DNS zone
    # holding the UCS names, so dev_run.sh resolves the one this talks to and
    # passes it in. The fallback only keeps the file parsable for other tasks.
    extra_hosts:
      - git.knut.univention.de:${GITLAB_IP}
      - host.docker.internal:host-gateway
      - ${UCS_PRIMARY_HOST:-primary.ucsschool.test}:${UCS_PRIMARY_IP:-127.0.0.1}
    volumes: *default-volumes
    env_file:
      - path: .env
      - path: .env.kelvin
    labels: *bff-labels
    develop: *bff-develop
  production_container:
    image: ucsschool-accounts-prod:latest
    build:
      context: ../
      extra_hosts:
        - git.knut.univention.de:${GITLAB_IP}
    container_name: ucsschool-accounts-production
    profiles:
      - clean-profile
      - prod-server
    depends_on:
      proxy:
        condition: service_started
      keycloak_provisioning:
        condition: service_completed_successfully
    extra_hosts: *extra_hosts
    volumes:
      - ../:/src
      - ./data/fake-machine.secret:/etc/machine.secret:ro
      - ./data/client.secret:/var/lib/univention-appcenter/apps/ucsschool-accounts/conf/client.secret:ro
      - ./data/session.secret:/var/lib/univention-appcenter/apps/ucsschool-accounts/conf/session.secret:ro
    env_file: *env-files
    environment:
      UCSSCHOOL_ACCOUNTS__FRONTEND_PREFIX: "/univention/ucsschool/ucsschool-accounts/ui"
    labels:
      traefik.http.routers.prod.entrypoints: web
      traefik.http.routers.prod.rule: PathPrefix(`/univention/ucsschool/ucsschool-accounts/`)
      traefik.http.routers.prod.service: prod
      traefik.http.services.prod.loadbalancer.server.port: 8000
  sphinx:
    image: docker-registry.knut.univention.de/sphinx:latest
    pull_policy: always
    container_name: ucsschool-accounts-sphinx
    command: ["make", "-C", "docs/ucsschool-accounts-module/", "livehtml"]
    working_dir: /project
    profiles:
      - sphinx
      - clean-profile
    depends_on:
      proxy:
        condition: service_started
    user: $DOCKER_USER
    extra_hosts: *extra_hosts
    volumes:
      - ../:/project
    labels:
      traefik.http.routers.sphinx.entrypoints: web
      traefik.http.routers.sphinx.rule: PathPrefix(`/docs/manual`)
      traefik.http.middlewares.strip-manual.stripprefix.prefixes: /docs/manual
      traefik.http.routers.sphinx.middlewares: strip-manual
      traefik.http.routers.sphinx.service: sphinx
      traefik.http.services.sphinx.loadbalancer.server.port: 8080
    env_file: *env-files
    environment:
      SPHINXOPTS: "--host 0.0.0.0 --port 8080"
