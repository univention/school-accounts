name: ucsschool-user-management
services:
  install_deps:
    image: ucsschool-user-management-dev:latest
    build: &docker-build
      dockerfile: dev/Dockerfile
      context: ../
    container_name: ucsschool-user-management-install_deps
    command: ["dev/scripts/install_deps.sh"]
    profiles:
      - clean-profile
      - dev-server
      - prod-server
    user: $DOCKER_USER
    extra_hosts: &extra_hosts
      - git.knut.univention.de:${GITLAB_IP}
      - host.docker.internal:host-gateway
    volumes: &default-volumes
      - ../:/src
    env_file: &env-files
      - path: .env
  run_command:
    image: ucsschool-user-management-dev:latest
    build: *docker-build
    container_name: ucsschool-user-management-run_command
    command: [ "echo", "'You should provide a command.'" ]
    profiles:
      - clean-profile
    depends_on:
      install_deps:
        condition: service_completed_successfully
    user: $DOCKER_USER
    extra_hosts: *extra_hosts
    volumes: *default-volumes
    env_file: *env-files
  cerbos:
    image: ghcr.io/cerbos/cerbos:0.54.0
    container_name: ucsschool-user-management-cerbos
    profiles:
      - clean-profile
      - cerbos-server
    ports:
      - "3592:3592"
      - "3593:3593"
    volumes:
      - ../appcenter-management/files/policies:/policies:ro
    command:
      - "server"
      - "--set=storage.driver=disk"
      - "--set=storage.disk.directory=/policies"
      # Watch for changes so editing a policy file takes effect live, without restarting the container.
      - "--set=storage.disk.watchForChanges=true"
      - "--set=telemetry.disabled=true"
  proxy:
    image: traefik:v2.11
    container_name: ucsschool-user-management-proxy
    hostname: user-management-proxy
    command:
      - --providers.docker
      - --entryPoints.web.address=:80
    profiles:
      - clean-profile
      - dev-server
      - sphinx
      - prod-server
    extra_hosts: *extra_hosts
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: *env-files
  keycloak_provisioning:
    image: ucsschool-user-management-dev:latest
    build: *docker-build
    container_name: ucsschool-user-management-keycloak_provisioning
    command: ["dev/scripts/provision_keycloak.sh"]
    profiles:
      - clean-profile
      - dev-server
      - prod-server
    depends_on:
      install_deps:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    user: $DOCKER_USER
    extra_hosts: *extra_hosts
    volumes: *default-volumes
    env_file: *env-files
  keycloak:
    container_name: ucsschool-user-management-keycloak
    image: ucsschool-user-management-keycloak:latest
    build:
      context: ./
      dockerfile: Keycloak.Dockerfile
    hostname: keycloak
    command: start
    profiles:
      - clean-profile
      - dev-server
      - prod-server
    healthcheck:
      test: "/opt/keycloak/bin/kcadm.sh get realms/master --server http://localhost:8080/keycloak --realm master --user admin --password admin"
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 40s
      start_interval: 2s
    depends_on:
      proxy:
        condition: service_started
    labels:
      traefik.http.routers.keycloak.entrypoints: web
      traefik.http.routers.keycloak.rule: PathPrefix(`/keycloak`)
      traefik.http.routers.keycloak.service: keycloak
      traefik.http.services.keycloak.loadbalancer.server.port: 8080
      traefik.http.middlewares.customheaders.headers.customrequestheaders.X-Forwarded-Proto: http
      traefik.http.routers.keycloak.middlewares: customheaders
  bff:
    image: ucsschool-user-management-dev:latest
    build: *docker-build
    container_name: ucsschool-user-management-bff
    command:
      - "uv"
      - "run"
      - "--project"
      - "user-management-bff"
      - "uvicorn"
      - "--reload"
      - "--reload-dir"
      - "user-management-bff/user_management_bff"
      - "--log-level"
      - "debug"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "user_management_bff.main:app"
    profiles:
      - clean-profile
      - dev-server
    depends_on:
      install_deps:
        condition: service_completed_successfully
      proxy:
        condition: service_started
      keycloak_provisioning:
        condition: service_completed_successfully
    user: $DOCKER_USER
    extra_hosts: *extra_hosts
    volumes: *default-volumes
    env_file: *env-files
    labels:
      traefik.http.routers.bff.entrypoints: web
      traefik.http.routers.bff.rule: PathPrefix(`${USER_MANAGEMENT__API_PREFIX}`) || PathPrefix(`/univention/ucsschool/user-management/ui`)
      traefik.http.routers.bff.service: bff
      traefik.http.services.bff.loadbalancer.server.port: 8000
    develop:
      watch:
        # backend project
        - action: sync
          path: ../user-management-bff
          target: /src/user-management-bff
        # backend dependencies
        - action: rebuild
          path: ../user-management-bff/pyproject.toml
        - action: rebuild
          path: ../user-management-bff/uv.lock
        # dev Dockerfile
        - action: rebuild
          path: Dockerfile
  production_container:
    image: ucsschool-user-management-prod:latest
    build:
      context: ../
      extra_hosts:
        - git.knut.univention.de:${GITLAB_IP}
    container_name: ucsschool-user-management-production
    profiles:
      - clean-profile
      - prod-server
    depends_on:
      proxy:
        condition: service_started
      keycloak_provisioning:
        condition: service_completed_successfully
    extra_hosts: *extra_hosts
    volumes:
      - ../:/src
      - ./data/fake-machine.secret:/etc/machine.secret:ro
    env_file: *env-files
    environment:
      USER_MANAGEMENT__FRONTEND_PREFIX: "/univention/ucsschool/user-management/ui"
    labels:
      traefik.http.routers.prod.entrypoints: web
      traefik.http.routers.prod.rule: PathPrefix(`/univention/ucsschool/user-management/`)
      traefik.http.routers.prod.service: prod
      traefik.http.services.prod.loadbalancer.server.port: 8000
  sphinx:
    image: docker-registry.knut.univention.de/sphinx:latest
    pull_policy: always
    container_name: ucsschool-user-management-sphinx
    command: ["make", "-C", "docs/ucsschool-user-management-module/", "livehtml"]
    working_dir: /project
    profiles:
      - sphinx
      - clean-profile
    depends_on:
      proxy:
        condition: service_started
    user: $DOCKER_USER
    extra_hosts: *extra_hosts
    volumes:
      - ../:/project
    labels:
      traefik.http.routers.sphinx.entrypoints: web
      traefik.http.routers.sphinx.rule: PathPrefix(`/docs/manual`)
      traefik.http.middlewares.strip-manual.stripprefix.prefixes: /docs/manual
      traefik.http.routers.sphinx.middlewares: strip-manual
      traefik.http.routers.sphinx.service: sphinx
      traefik.http.services.sphinx.loadbalancer.server.port: 8080
    env_file: *env-files
    environment:
      SPHINXOPTS: "--host 0.0.0.0 --port 8080"
