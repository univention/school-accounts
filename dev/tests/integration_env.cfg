[Global]
# These settings can be overwritten by the instance
# logfile: ucs-kvm.log

kvm_extra_label: ucsschool-user-management-[ENV:CI_JOB_ID]
kvm_server: [ENV:KVM_SERVER]
kvm_user: build
kvm_operating_system: Others
kvm_template: generic
kvm_ucsversion: 5.0-6
kvm_architecture: amd64
kvm_memory: 4G
kvm_vcpus: 4

recovery: 6

kvm_dhcp: true

environment:
 TARGET_VERSION=[ENV:TARGET_VERSION]
 UCSSCHOOL_USER_MANAGEMENT_VERSION=[ENV:UCSSCHOOL_USER_MANAGEMENT_VERSION]

[primary]
kvm_template: ucs-school-multiserver-primary
command1:
 . utils.sh && add_tech_key_authorized_keys
 . utils.sh && basic_setup
 . utils.sh && basic_setup_ucs_joined [SELF_IP]
 . utils.sh && rotate_logfiles
 . utils.sh && import_license 300000
 . utils.sh && wait_for_repo_server
 . utils.sh && activate_ucsschool_repositories
 . utils.sh && jenkins_updates
 . utils.sh && do_reboot
 LOCAL sleep 60
 . utils.sh && wait_for_reboot && wait_for_slapd
command2:
 . utils.sh && assert_join
 . utils.sh && assert_version "$TARGET_VERSION"
 . utils.sh && assert_app_is_installed ucsschool
 . utils.sh && assert_packages ucs-school-multiserver
 # Guardian setup
 . utils.sh && install_apps_via_cmdline Administrator univention keycloak
 . utils.sh && switch_app_center
command3:
 # Guardian setup on backup
command4:
 . utils.sh && install_with_unmaintained jq
 univention-keycloak oidc/rp secret --client-name guardian-management-api | tail -n 1 | tr "'" '"' | jq -r '.value' > /tmp/m2m_secret
 echo univention > /tmp/password
 univention-scp /tmp/password /tmp/m2m_secret backup1:/var/lib/univention-appcenter/apps/guardian-management-api/conf/m2m.secret
command5:
 # run tests on backup

[backup1]
kvm_template: ucs-school-multiserver-backup1
command1:
 . utils.sh && add_tech_key_authorized_keys
 . utils.sh && basic_setup
 . utils.sh && basic_setup_ucs_joined [primary_IP]
 . utils.sh && rotate_logfiles
command2:
 . utils.sh && wait_for_repo_server
 . utils.sh && activate_ucsschool_repositories
 . utils.sh && jenkins_updates
 . utils.sh && run_join_scripts univention
 . utils.sh && do_reboot
 LOCAL sleep 60
 . utils.sh && wait_for_reboot && wait_for_slapd
command3:
 . utils.sh && assert_join
 . utils.sh && assert_version "$TARGET_VERSION"
 . utils.sh && assert_app_is_installed ucsschool
 . utils.sh && assert_packages ucs-school-multiserver
 # Guardian setup
 . utils.sh && switch_app_center
 . utils.sh && install_apps_via_cmdline Administrator univention ucsschool-kelvin-rest-api
 . utils.sh && install_apps_via_cmdline Administrator univention guardian-management-api
 . utils.sh && install_apps_via_cmdline Administrator univention guardian-authorization-api
command4:
 # prepare keycloak M2M secret on the primary
 /usr/share/ucs-school-import/scripts/ucs-school-user-import -c /usr/share/ucs-school-import/configs/ucs-school-testuser-import.json -i import_users.csv
 udm users/user modify --dn "uid=max.student,cn=schueler,cn=users,ou=school1,dc=school,dc=test" --set password=univention
 udm users/user modify --dn "uid=mina.teacher,cn=lehrer,cn=users,ou=school1,dc=school,dc=test" --set password=univention
command5:
 univention-app configure guardian-authorization-api
 univention-app restart guardian-authorization-api
 univention-app configure guardian-management-api
 univention-app restart guardian-management-api
 . utils.sh && switch_to_test_app_center
 . utils.sh && install_apps_via_cmdline Administrator univention ucsschool-user-management="$UCSSCHOOL_USER_MANAGEMENT_VERSION"
 univention-app configure ucsschool-user-management --set ucsschool-user-management/guardian/url=https://backup1.school.test/guardian/authorization
 # tests
 cp ucsschool-user-management-test.json /var/lib/univention-appcenter/apps/ucsschool-user-management/conf/
 univention-app shell ucsschool-user-management /usr/local/bin/keycloak-provisioning --username Administrator --password univention --url https://ucs-sso-ng.school.test --realm ucs --user-realm master clients add /var/lib/univention-appcenter/apps/ucsschool-user-management/conf/ucsschool-user-management-test.json
 univention-app shell ucsschool-user-management python3 -m pytest -m "e2e" --base_url "https://backup1.school.test/univention/ucsschool/user-management" --junit-xml=/tmp/junit.xml
command6:
 mkdir -p /root/test-reports/
 univention-app shell ucsschool-user-management cat /tmp/junit.xml > /root/test-reports/ucsschool-user-management-in_container.xml
 . utils.sh && prepare_results
 LOCAL utils/utils-local.sh fetch-results [SELF_IP] [SELF]
files:
 import_users.csv /root/
 ucsschool-user-management-test.json /root/
