[project]
name = "user-management-product-tests"
version = "0.1.0"
description = ""
authors = [{ name = "Jürn Brodersen", email = "brodersen@univention.de" }]
requires-python = ">=3.10,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pytest-playwright>=0.4.4",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "kelvin-rest-api-client>=2.2.3",
    "setuptools>=69.5.1",
    "nest-asyncio>=1.6.0",
    "faker>=25.0.1",
    "playwright>=1.43.0",
    "pytest-rerunfailures>=14.0",
]

[dependency-groups]
dev = []

[tool.uv]

[tool.uv.build-backend]
module-name = ["user_management"]
module-root = ""
namespace = true

[build-system]
requires = ["uv_build>=0.11.17"]
build-backend = "uv_build"
