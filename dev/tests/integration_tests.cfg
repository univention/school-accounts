[Global]
parallel: true
openstack_flavor_name: UNIVENTION-4V-8-100s
extra_label: user-management-branch-test-[ENV:CI_COMMIT_REF_SLUG]
recover: 8

environment:
 TARGET_VERSION=[ENV:TARGET_VERSION]
 UCSSCHOOL_USER_MANAGEMENT_VERSION=[ENV:UCSSCHOOL_USER_MANAGEMENT_VERSION]
 UCS_TEST_APPCENTER=true

[primary]
openstack_image_name: [ENV:TARGET_VERSION]-dev-ucsschool-guardian-primary
command1:
 . utils.sh && add_tech_key_authorized_keys
 . utils.sh && basic_setup
 . utils.sh && basic_setup_ucs_joined [SELF_IP]
 . utils.sh && switch_app_center
 LOCAL chmod 0600 [ENV:SSH_PRIVATE_KEY_TECH]
command2:
 # Import test users
 udm mail/domain create --position "cn=domain,cn=mail,dc=ucsschool,dc=test" --set name="school1.ucsschool.test"
 udm mail/domain create --position "cn=domain,cn=mail,dc=ucsschool,dc=test" --set name="school2.ucsschool.test"
 /usr/share/ucs-school-import/scripts/ucs-school-user-import -c /usr/share/ucs-school-import/configs/ucs-school-testuser-import.json -i import_users.csv
 udm users/user modify --dn "uid=max.student,cn=schueler,cn=users,ou=school1,dc=ucsschool,dc=test" --set password=univention
 udm users/user modify --dn "uid=armin.staff,cn=mitarbeiter,cn=users,ou=school1,dc=ucsschool,dc=test" --set password=univention
 udm users/user modify --dn "uid=mina.teacher,cn=lehrer,cn=users,ou=school1,dc=ucsschool,dc=test" --set password=univention
 udm users/user modify --dn "uid=alex.admin,cn=mitarbeiter,cn=users,ou=school1,dc=ucsschool,dc=test" --set password=univention --set ucsschoolRole=school_admin:school:school1 --append groups=cn=admins-school1,cn=ouadmins,cn=groups,dc=ucsschool,dc=test
command3:
 # Install ucsschool-user-management
 . utils.sh && install_apps ucsschool-user-management="$UCSSCHOOL_USER_MANAGEMENT_VERSION"
 sleep 10 && univention-app restart ucsschool-user-management
 univention-check-join-status
 # Verify inst registered the Cerbos policy bundle in LDAP, fail if not registered
 udm settings/data list --filter name=ucsschool-user-management-policies | grep -q "data_type: guardian/policy-bundle" || (echo "ERROR: Cerbos policy bundle not registered in LDAP" >&2 && exit 1)
 # Install Keycloak test client
 cp ucsschool-user-management-test.json /var/lib/univention-appcenter/apps/ucsschool-user-management/conf/
 univention-app shell ucsschool-user-management /venv/bin/keycloak-provisioning --username Administrator --password univention --url https://ucs-sso-ng.ucsschool.test --realm ucs --user-realm master clients add /var/lib/univention-appcenter/apps/ucsschool-user-management/conf/ucsschool-user-management-test.json
command4:
 # Install on backup
command5:
 # Run tests
 # "|| true" so that failing tests do not skip the junit collection below,
 # the job is failed by dev/tests/parse_junit.py instead
 univention-app shell ucsschool-user-management python3 -m pytest -lvv -m "e2e" --kelvin_url="primary.ucsschool.test" --base_url="https://primary.ucsschool.test/univention/ucsschool/user-management" --cerbos_url="cerbos:3593" --junit-xml=/tmp/junit.xml --junit-prefix=primary || true
 mkdir -p /root/test-reports/
 univention-app shell ucsschool-user-management cat /tmp/junit.xml > /root/test-reports/junit.xml
 . utils.sh && prepare_results
 LOCAL [ENV:VMUTILSPATH]/utils/utils-local.sh fetch-files [SELF_IP] /root/test-reports/junit.xml primary_junit.xml
 LOCAL [ENV:VMUTILSPATH]/utils/utils-local.sh fetch-files [SELF_IP] /var/log/univention/join.log primary_join.log
command6:
 # Run tests backup1
command7:
 LOCAL [ENV:VMUTILSPATH]/utils/utils-local.sh fetch-files [SELF_IP] /var/log/univention/ucsschool-kelvin-rest-api/http.log primary_kelvin_http.log

files:
 dev/tests/import_users.csv /root/
 dev/tests/ucsschool-user-management-test.json /root/
 dev/tests/helpers.sh /root/
 user-management.tar /root/
