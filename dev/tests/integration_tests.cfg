[Global]
kvm_extra_label: ucsschool-user-management-[ENV:GITLAB_USER_LOGIN]-[ENV:CI_JOB_ID]
kvm_server: [ENV:KVM_SERVER]
kvm_user: build
kvm_operating_system: Others
kvm_template: generic
kvm_ucsversion: 5.0-7
kvm_architecture: amd64
kvm_memory: 4G
kvm_vcpus: 4
kvm_dhcp: true

environment:
 TARGET_VERSION=[ENV:TARGET_VERSION]
 UCSSCHOOL_USER_MANAGEMENT_VERSION=[ENV:UCSSCHOOL_USER_MANAGEMENT_VERSION]

[primary]
kvm_template: ucsschool-guardian-testing-primary
command1:
 . utils.sh && basic_setup
 . utils.sh && basic_setup_ucs_joined [SELF_IP]
 . utils.sh && rotate_logfiles
 . utils.sh && wait_for_repo_server
 service univention-directory-manager-rest restart
 univention-app restart ucsschool-kelvin-rest-api
 univention-app restart keycloak
 . utils.sh && upgrade_to_latest_patchlevel
 . utils.sh && assert_version "$TARGET_VERSION"
command2:
 # Import test users
 udm mail/domain create --position "cn=domain,cn=mail,dc=school,dc=test" --set name="school1.school.test"
 udm mail/domain create --position "cn=domain,cn=mail,dc=school,dc=test" --set name="school2.school.test"
 /usr/share/ucs-school-import/scripts/ucs-school-user-import -c /usr/share/ucs-school-import/configs/ucs-school-testuser-import.json -i import_users.csv || die
 udm users/user modify --dn "uid=max.student,cn=schueler,cn=users,ou=school1,dc=school,dc=test" --set password=univention
 udm users/user modify --dn "uid=armin.staff,cn=mitarbeiter,cn=users,ou=school1,dc=school,dc=test" --set password=univention
 udm users/user modify --dn "uid=mina.teacher,cn=lehrer,cn=users,ou=school1,dc=school,dc=test" --set password=univention
 udm users/user modify --dn "uid=alex.admin,cn=mitarbeiter,cn=users,ou=school1,dc=school,dc=test" --set password=univention --set ucsschoolRole=school_admin:school:school1 --append groups=cn=admins-school1,cn=ouadmins,cn=groups,dc=school,dc=test
command3:
 # Install ucsschool-user-management
 . helpers.sh && install_local_app_version appcenter-management [ENV:IMAGE_TAG]
 univention-app configure ucsschool-user-management --set ucsschool-user-management/guardian/url=https://backup1.school.test/guardian/authorization ucsschool-user-management/kelvin/url=primary.school.test
 # Install Keycloak test client
 cp ucsschool-user-management-test.json /var/lib/univention-appcenter/apps/ucsschool-user-management/conf/
 univention-app shell ucsschool-user-management /usr/local/bin/keycloak-provisioning --username Administrator --password univention --url https://ucs-sso-ng.school.test --realm ucs --user-realm master clients add /var/lib/univention-appcenter/apps/ucsschool-user-management/conf/ucsschool-user-management-test.json
command4:
 # Install on backup
command5:
 # Run tests
 univention-app shell ucsschool-user-management python3 -m pytest -lvv -m "e2e" --kelvin_url "primary.school.test" --base_url "https://primary.school.test/univention/ucsschool/user-management" --guardian_management_url "https://backup1.school.test/guardian/management" --junit-xml=/tmp/junit.xml --junit-prefix=primary
 mkdir -p /root/test-reports/
 univention-app shell ucsschool-user-management cat /tmp/junit.xml > /root/test-reports/junit.xml
 . utils.sh && prepare_results
 LOCAL utils/utils-local.sh fetch-files [SELF_IP] /root/test-reports/junit.xml primary_junit.xml
 LOCAL utils/utils-local.sh fetch-files [SELF_IP] /var/log/univention/join.log primary_join.log
command6:
 # Run tests backup1
command7:
 # Frontend tests
 tar -xf user-management.tar
 docker run -v /root/user-management/:/user-management --security-opt seccomp=unconfined --rm --ipc=host mcr.microsoft.com/playwright:v1.43.0-jammy /user-management/dev/tests/playwright_integration_test.sh primary.school.test
 LOCAL utils/utils-local.sh fetch-files [SELF_IP] /root/user-management/user-management-ui/results.xml primary_playwright_junit.xml
 LOCAL utils/utils-local.sh fetch-files [SELF_IP] /root/user-management/user-management-ui/playwright-report primary_playwright-report
 # Product Tests
 docker run -v /root/user-management/:/user-management --security-opt seccomp=unconfined --rm --ipc=host mcr.microsoft.com/playwright/python:v1.43.0-jammy /user-management/dev/tests/playwright_product_test.sh primary.school.test /user-management/product_tests.xml primary
 LOCAL utils/utils-local.sh fetch-files [SELF_IP] /root/user-management/product_tests.xml primary_product_tests_junit.xml
 # folder is deleted on success, but fetch-files fails if the folder does not exist
 mkdir -p /root/user-management/dev/tests/product-tests/test-results
 LOCAL utils/utils-local.sh fetch-files [SELF_IP] /root/user-management/dev/tests/product-tests/test-results primary_producttest_traces
command8:
 LOCAL utils/utils-local.sh fetch-files [SELF_IP] /var/log/univention/ucsschool-kelvin-rest-api/http.log primary_kelvin_http.log

files:
 import_users.csv /root/
 ucsschool-user-management-test.json /root/
 helpers.sh /root/
 ../../appcenter-management/ini /root/appcenter-management/
 ../../appcenter-management/preinst /root/appcenter-management/
 ../../appcenter-management/inst /root/appcenter-management/
 ../../appcenter-management/uinst /root/appcenter-management/
 ../../appcenter-management/compose /root/appcenter-management/
 ../../appcenter-management/configure /root/appcenter-management/
 ../../appcenter-management/configure_host /root/appcenter-management/
 ../../appcenter-management/settings /root/appcenter-management/
 ../../user-management.tar /root/

[backup1]
kvm_template: ucsschool-guardian-testing-backup1
command1:
 . utils.sh && rotate_logfiles
 . utils.sh && wait_for_repo_server
 . utils.sh && basic_setup
 . utils.sh && basic_setup_ucs_joined [primary_IP]
 udm dns/host_record modify --dn "relativeDomainName=ucs-sso-ng,zoneName=$(ucr get domainname),cn=dns,$(ucr get ldap/base)" --set a=[primary_IP]
 . utils.sh && upgrade_to_latest_patchlevel
 . utils.sh && assert_version "$TARGET_VERSION"
command2:
 # Remove after https://git.knut.univention.de/univention/components/authorization-engine/guardian/-/merge_requests/274 was merged and the base image rebuild:
 . utils.sh && udm computers/domaincontroller_backup modify --dn "$(ucr get ldap/hostdn)" --append service="guardian-management-api" || die
 . utils.sh && udm computers/domaincontroller_backup modify --dn "$(ucr get ldap/hostdn)" --append service="guardian-authorization-api" || die
command3:
 # Install on primary
command4:
 . helpers.sh && install_local_app_version appcenter-management [ENV:IMAGE_TAG]
 univention-app configure ucsschool-user-management --set ucsschool-user-management/guardian/url=https://backup1.school.test/guardian/authorization ucsschool-user-management/kelvin/url=primary.school.test
 # Install Keycloak test client
 cp ucsschool-user-management-test.json /var/lib/univention-appcenter/apps/ucsschool-user-management/conf/
command5:
 # Run tests primary
command6:
 # Run tests
 univention-app shell ucsschool-user-management python3 -m pytest -lvv -m "e2e" --kelvin_url "primary.school.test" --base_url "https://backup1.school.test/univention/ucsschool/user-management" --guardian_management_url "https://backup1.school.test/guardian/management" --junit-xml=/tmp/junit.xml --junit-prefix=backup1
 mkdir -p /root/test-reports/
 univention-app shell ucsschool-user-management cat /tmp/junit.xml > /root/test-reports/junit.xml
 . utils.sh && prepare_results
 LOCAL utils/utils-local.sh fetch-files [SELF_IP] /root/test-reports/junit.xml backup1_junit.xml
 LOCAL utils/utils-local.sh fetch-files [SELF_IP] /var/log/univention/join.log backup1_join.log
command7:
 # Frontend tests
 tar -xf user-management.tar
 docker run -v /root/user-management/:/user-management --security-opt seccomp=unconfined --rm --ipc=host mcr.microsoft.com/playwright:v1.43.0-jammy /user-management/dev/tests/playwright_integration_test.sh backup1.school.test
 LOCAL utils/utils-local.sh fetch-files [SELF_IP] /root/user-management/user-management-ui/results.xml backup1_playwright_junit.xml
 LOCAL utils/utils-local.sh fetch-files [SELF_IP] /root/user-management/user-management-ui/playwright-report backup1_playwright-report
 # Product Tests
 docker run -v /root/user-management/:/user-management --security-opt seccomp=unconfined --rm --ipc=host mcr.microsoft.com/playwright/python:v1.43.0-jammy /user-management/dev/tests/playwright_product_test.sh backup1.school.test /user-management/product_tests.xml backup1
 LOCAL utils/utils-local.sh fetch-files [SELF_IP] /root/user-management/product_tests.xml backup1_product_tests_junit.xml
 # folder is deleted on success, but fetch-files fails if the folder does not exist
 mkdir -p /root/user-management/dev/tests/product-tests/test-results
 LOCAL utils/utils-local.sh fetch-files [SELF_IP] /root/user-management/dev/tests/product-tests/test-results backup1_producttest_traces
command8:
 # get kelvin logs from primary
files:
 ucsschool-user-management-test.json /root/
 helpers.sh /root/
 ../../appcenter-management/ini /root/appcenter-management/
 ../../appcenter-management/preinst /root/appcenter-management/
 ../../appcenter-management/inst /root/appcenter-management/
 ../../appcenter-management/uinst /root/appcenter-management/
 ../../appcenter-management/compose /root/appcenter-management/
 ../../appcenter-management/configure /root/appcenter-management/
 ../../appcenter-management/configure_host /root/appcenter-management/
 ../../appcenter-management/settings /root/appcenter-management/
 ../../user-management.tar /root/
