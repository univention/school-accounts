# Mapping for `pybabel extract` (scripts/check_translations.sh). Patterns are
# relative to the directory pybabel is pointed at, i.e. ucsschool_accounts/.
#
# Do not use `{% trans %}` blocks: babel_extract always loads jinja2.ext.i18n so
# they extract fine, but the runtime environment in routes.py does not load it and
# rendering would fail. Templates translate via `{{ _("...") }}`.
[python: **.py]
[jinja2: templates/**.html]
