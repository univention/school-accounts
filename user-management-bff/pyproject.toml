[tool.poetry]
name = "user-management-bff"
version = "0.1.0"
description = ""
authors = ["UCS School Maintainers <ucsschool-maintainers@univention.de>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
loguru = "^0.7.2"
port-loader = "1.2.0"
gunicorn = "^21.2.0"
uvicorn = "^0.26.0"
orjson = "^3.9.12"
lazy-object-proxy = "^1.10.0"


[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-cov = "^4.1.0"


[[tool.poetry.source]]
name = "port-loader"
url = "https://git.knut.univention.de/api/v4/projects/908/packages/pypi/simple"
priority = "supplemental"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 105
target-version = ['py311']

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 105
select = ["E", "F", "I"]
indent-width = 4
target-version = "py311"

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.run]
omit = [
    "main.py",
    "constants.py",
    "logging.py"
    ]
