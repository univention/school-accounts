[project]
name = "user-management-bff"
version = "0.2.0"
description = ""
authors = [{ name = "UCS School Maintainers", email = "ucsschool-maintainers@univention.de" }]
requires-python = ">=3.11,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.109.0",
    "jinja2>=3.1.0",
    "loguru>=0.7.2",
    "port-loader==1.4.0",
    "gunicorn>=25.1.0",
    "uvicorn>=0.26.0",
    "orjson>=3.9.12",
    "lazy-object-proxy>=1.10.0",
    "pydantic-settings>=2.1.0",
    "kelvin-rest-api-client>=2.4.2",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "python-keycloak>=3.9.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.4",
    "cerbos>=0.15.1",
    # Transitive deps of cerbos regardless of client choice, but the adapter now imports these
    # directly (grpc.aio.AioRpcError, google.protobuf.struct_pb2) rather than only through cerbos.
    "grpcio>=1.83.0",
    "protobuf>=7.35.1",
    "w3lib>=2.1.2",
    "authlib>=1.3.0",
    "itsdangerous>=2.1.0",
    "typing-extensions>=4.12.0; python_version < '3.12'",
]

[project.scripts]
keycloak-provisioning = "keycloak_provisioning.cli.main:run_script"

[dependency-groups]
dev = [
    "nest_asyncio>=1.6.0",
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0,<0.28.0",
    "pytest-asyncio>=0.23.4",
    "pytest-mock>=3.12.0",
    "faker>=24.2.0",
    "nest-asyncio>=1.6.0",
    "pytest-playwright>=0.7.0",
    "watchfiles>=1.0.0",
]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
port-loader = { index = "port-loader" }

[[tool.uv.index]]
name = "port-loader"
url = "https://git.knut.univention.de/api/v4/projects/908/packages/pypi/simple"
explicit = true

[tool.uv.build-backend]
module-name = [
    "user_management_bff",
    "keycloak_provisioning",
]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.17"]
build-backend = "uv_build"

[tool.black]
line-length = 105
target-version = ['py311']

[tool.ruff]
line-length = 105
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "B904"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.run]
omit = [
    "main.py",
    "constants.py",
    "logging.py"
    ]
source_pkgs = [
    "user_management_bff",
    "keycloak_provisioning"
    ]

[tool.pytest.ini_options]
markers = [
    "e2e: marks tests as e2e tests (deselect with '-m \"not e2e\"')",
]
filterwarnings = [
    # Starlette's TestClient passes the deprecated `app` shortcut to httpx
    # internally; not something we control from our own code.
    "ignore:The 'app' shortcut is now deprecated:DeprecationWarning",
]
