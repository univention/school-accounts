[tool.poetry]
name = "user-management-bff"
version = "0.1.1"
description = ""
authors = ["UCS School Maintainers <ucsschool-maintainers@univention.de>"]
readme = "README.md"
packages = [
    { include = "user_management_bff" },
    { include = "keycloak_provisioning" },
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
loguru = "^0.7.2"
port-loader = "1.2.0"
gunicorn = "^21.2.0"
uvicorn = "^0.26.0"
orjson = "^3.9.12"
lazy-object-proxy = "^1.10.0"
pydantic-settings = "^2.1.0"
kelvin-rest-api-client = "^2.2.3"
typer = "^0.9.0"
rich = "^13.7.0"
python-keycloak = "^3.9.0"
pyjwt = "^2.8.0"
cryptography = "^42.0.4"
guardian-authz-client = "^0.1.0"
w3lib = "^2.1.2"


[tool.poetry.group.dev.dependencies]
nest_asyncio = "^1.6.0"
pytest = "^7.4.4"
pytest-cov = "^4.1.0"
httpx = ">=0.27.0,<0.28.0"
pytest-asyncio = "^0.23.4"
pytest-mock = "^3.12.0"
faker = "^24.2.0"
nest-asyncio = "^1.6.0"


[[tool.poetry.source]]
name = "port-loader"
url = "https://git.knut.univention.de/api/v4/projects/908/packages/pypi/simple"
priority = "supplemental"


[[tool.poetry.source]]
name = "guardian-authz-client"
url = "https://git.knut.univention.de/api/v4/projects/1062/packages/pypi/simple"
priority = "supplemental"

[tool.poetry.scripts]
keycloak-provisioning = "keycloak_provisioning.cli.main:run_script"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 105
target-version = ['py311']

[tool.mypy]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 105
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "B904"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.run]
omit = [
    "main.py",
    "constants.py",
    "logging.py"
    ]
source_pkgs = [
    "user_management_bff",
    "keycloak_provisioning"
    ]

[tool.pytest.ini_options]
markers = [
    "e2e: marks tests as e2e tests (deselect with '-m \"not e2e\"')",
]
