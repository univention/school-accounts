{# Classes and work groups share one single-select control, so each item value
   carries its kind as a prefix and the route splits it apart again. #}
<u-list-select
  id="group-list"
  name="group"
  grow
  size="md"
  filterable
  heading="{{ _('Classes & Work Groups') }}"
  placeholder="{{ _('Filter classes and work groups') }}"
  {% if selected_group %}value="{{ selected_group }}"{% endif %}
  hx-get="{{ frontend_prefix }}/users/groups"
  hx-trigger="u-search delay:300ms"
  hx-target="this"
  hx-swap="innerHTML"
  hx-vals='js:{school: {{ (selected_school or "") | tojson }}, q: event.detail.query}'
>
  {% include "fragments/group_options.html" %}
</u-list-select>
